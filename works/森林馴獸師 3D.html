function spawnWild(){let x,z;do{x=R(-MX,MX);z=R(-MZ,MZ)}while(Math.hypot(x-P.x,z-P.z)<22);const s=Math.floor(R(0,7)),b=mkAni(s,x,z);
const ring=new T.Mesh(new T.RingGeometry(1.8,2.2,32),new T.MeshBasicMaterial({color:0xffc107,transparent:true,opacity:.8,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.1;ring.visible=false;b.g.add(ring);
wild.push({s,b,x,z,dx:0,dz:0,tm:0,prog:0,ring})}
function spawnFood(){let x,z;do{x=R(-MX,MX);z=R(-MZ,MZ)}while(nearSt(x,z,4));const k=Math.floor(R(0,7)),s=spr(S[k].f);s.scale.set(1.6,1.6,1);s.position.set(x,1,z);sc.add(s);foods.push({k,x,z,s})}
function spawnVeg(){let x,z;do{x=R(-MX,MX);z=R(-MZ,MZ)}while(nearSt(x,z,4)||Math.hypot(x-P.x,z-P.z)<3);const s=mkVeg();s.position.set(x,0,z);s.rotation.y=R(0,6);sc.add(s);const v={x,z,s,dig:0};s.userData={kind:'veg',v};veg.push(v)}
function clear(){[...(wild||[]),...(tamed||[])].forEach(a=>sc.remove(a.b.g));[...(foods||[]),...(veg||[])].forEach(a=>sc.remove(a.s))}
function start(){sel=0;hoeD=12;spare=0;wood=0;clear();P={x:0,z:0};thirst=TM;hunger=HM;inv=Array(7).fill(0);wild=[];tamed=[];foods=[];veg=[];hist=[];count=0;
for(let i=0;i<12;i++)spawnWild();for(let i=0;i<36;i++)spawnFood();for(let i=0;i<10;i++)spawnVeg();$('ov').style.display='none';run=true}
function end(win,msg){run=false;$('ot').textContent=win?'🎉 通關成功！':'💀 遊戲失敗';$('od').textContent=msg;$('go').textContent='再玩一次';$('ov').style.display='flex'}
$('go').onclick=start;
function face(g,dx,dz,dt){if(Math.abs(dx)+Math.abs(dz)<1e-3)return;let d=Math.atan2(dx,dz)-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*8)}
function walk(b,mv){b.legs.forEach((l,i)=>l.rotation.x=mv?Math.sin(clk*10+(i==0||i==3?0:Math.PI))*.55:l.rotation.x*.8)}
function upd(dt){
let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(ptr){const dx=ptr.x-ptr.ox,dy=ptr.y-ptr.oy,l=Math.hypot(dx,dy);if(l>8){vx=dx/Math.max(l,50);vz=dy/Math.max(l,50)}}
const l=Math.hypot(vx,vz);if(l>1){vx/=l;vz/=l}const mv=l>.05;
yaw+=((keys.q?1:0)-(keys.e?1:0))*1.8*dt;const wx=vx*Math.cos(yaw)+vz*Math.sin(yaw),wz=-vx*Math.sin(yaw)+vz*Math.cos(yaw);P.x=Math.max(-MX,Math.min(MX,P.x+wx*7*dt));P.z=Math.max(-MZ,Math.min(MZ,P.z+wz*7*dt));trees.forEach(t=>{if(t.userData.fall)return;const dx=P.x-t.position.x,dz=P.z-t.position.z,d=Math.hypot(dx,dz)||.01;if(d<.9){P.x=t.position.x+dx/d*.9;P.z=t.position.z+dz/d*.9}});
const h0=hist[0];if(!h0||Math.hypot(h0.x-P.x,h0.z-P.z)>.3){hist.unshift({x:P.x,z:P.z});if(hist.length>400)hist.pop()}
PL.position.set(P.x,Math.abs(Math.sin(clk*10))*.08*mv,P.z);face(PL,vx,vz,dt);PL.legs.forEach((q,i)=>q.rotation.x=mv?Math.sin(clk*10+i*Math.PI)*.6:0);
thirst-=dt;hunger-=dt;if(nearSt(P.x,P.z,3))thirst=Math.min(TM,thirst+dt*25);
if(keys['1'])sel=0;if(keys['2'])sel=1;treeUpd(dt);vegUpd(dt);
for(let i=foods.length-1;i>=0;i--){const f=foods[i];if(Math.hypot(f.x-P.x,f.z-P.z)<2.2){inv[f.k]++;sc.remove(f.s);foods.splice(i,1);spawnFood()}}
foods.forEach((f,i)=>f.s.position.y=1+Math.sin(clk*3+i)*.15);
for(let i=wild.length-1;i>=0;i--){const a=wild[i];a.tm-=dt;if(a.tm<=0){a.tm=R(1.5,4);const t=R(0,6.28),k=Math.random()<.45?0:1;a.dx=Math.cos(t)*k;a.dz=Math.sin(t)*k}
a.x=Math.max(-MX,Math.min(MX,a.x+a.dx*2*dt));a.z=Math.max(-MZ,Math.min(MZ,a.z+a.dz*2*dt));a.b.g.position.set(a.x,0,a.z);face(a.b.g,a.dx,a.dz,dt);walk(a.b,a.dx||a.dz);
if(Math.hypot(a.x-P.x,a.z-P.z)<3.4)a.prog+=dt;else a.prog=Math.max(0,a.prog-dt);
a.ring.visible=a.prog>0;a.ring.scale.setScalar(1.6-a.prog*.7);a.ring.material.opacity=.3+a.prog*.6;
if(a.prog>=1){a.ring.visible=false;wild.splice(i,1);const s=new T.Sprite(sprC[S[a.s].f]||spr(S[a.s].f).material);s.scale.set(1.3,1.3,1);s.position.y=a.b.top;s.visible=false;a.b.g.add(s);
tamed.push({s:a.s,b:a.b,x:a.x,z:a.z,hungry:false,hT:0,next:R(25,70),sp:s,lx:a.x,lz:a.z});count++;spawnWild();toast('🎉 馴服了'+S[a.s].n+'！');if(count>=GOAL){end(true,'你成功馴服了 '+GOAL+' 隻動物，森林成了你的家！');return}}}
tamed.forEach((a,i)=>{const h=hist[Math.min(hist.length-1,(i+1)*8)];const ox=a.x,oz=a.z;a.x+=(h.x-a.x)*Math.min(1,dt*6);a.z+=(h.z-a.z)*Math.min(1,dt*6);
const mvx=a.x-ox,mvz=a.z-oz;a.b.g.position.set(a.x,0,a.z);face(a.b.g,mvx,mvz,dt);walk(a.b,Math.hypot(mvx,mvz)/dt>.6);
if(!a.hungry){a.next-=dt;if(a.next<=0){a.hungry=true;a.hT=35;a.sp.visible=true}}
if(a.hungry){a.sp.position.y=a.b.top+Math.sin(clk*6)*.15;if(inv[a.s]>0){inv[a.s]--;a.hungry=false;a.sp.visible=false;a.next=R(60,120);toast(S[a.s].f+' 餵飽了'+S[a.s].n)}else{a.hT-=dt;if(a.hT<=0&&run){end(false,S[a.s].n+'沒有等到'+S[a.s].fn+'，餓壞了！');return}}}});
if(thirst<=0)end(false,'你渴壞了！記得走進溪流喝水。');else if(hunger<=0)end(false,'你餓壞了！記得尋找野菜。');
}
function hud(){
$('cnt').innerHTML='🐾 已馴服 <b>'+count+' / '+GOAL+'</b>';
const t=Math.max(0,Math.ceil(thirst)),h=Math.max(0,Math.ceil(hunger));
$('tt').textContent=t+' 秒';$('ht').textContent=h+' 秒';$('tt').style.color=t<=15?'#e53935':'';$('ht').style.color=h<=20?'#e53935':'';
$('tb').style.width=Math.max(0,thirst/TM*100)+'%';$('hb').style.width=Math.max(0,hunger/HM*100)+'%';
$('inv').innerHTML='🎒 食物<br>'+S.map((f,i)=>f.f+'×'+inv[i]).join(' ');
const hu=tamed.filter(a=>a.hungry).sort((a,b)=>a.hT-b.hT).slice(0,5),w=$('warn');w.style.display=hu.length?'block':'none';
w.innerHTML=hu.map(a=>'⚠️ '+S[a.s].n+' 要吃'+S[a.s].f+' <b style="color:#e53935">'+Math.ceil(a.hT)+'s</b>').join('<br>');
}
const rc=$('rd').getContext('2d');
function radar(){rc.clearRect(0,0,120,120);rc.save();rc.beginPath();rc.arc(60,60,60,0,7);rc.clip();rc.fillStyle='rgba(235,250,220,.85)';rc.fillRect(0,0,120,120);rc.translate(60,60);rc.rotate(yaw);const k=.9,pt=(x,z,c,r)=>{rc.fillStyle=c;rc.beginPath();rc.arc((x-P.x)*k,(z-P.z)*k,r,0,7);rc.fill()};
rc.strokeStyle='#5bc4f0';rc.lineWidth=5;[0,1].forEach(i=>{rc.beginPath();for(let x=P.x-70;x<=P.x+70;x+=7)rc[x<P.x-69?'moveTo':'lineTo']((x-P.x)*k,(sz(i,x)-P.z)*k);rc.stroke()});
veg.forEach(v=>pt(v.x,v.z,'#2e9e3a',2.5));wild.forEach(a=>pt(a.x,a.z,'#f57c00',3.5));rc.restore();rc.fillStyle='#d32f2f';rc.beginPath();rc.moveTo(60,50);rc.lineTo(55,66);rc.lineTo(65,66);rc.fill()}
makeTrees();start();run=false;$('ov').style.display='flex';
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;clk+=dt;if(run)upd(dt);
cam.rotation.order='YXZ';cam.position.set(P.x,1.7+Math.sin(clk*10)*.05*(ptr||keys.w||keys.s?1:0),P.z);cam.rotation.set(pitch,yaw,0);hud();barUpd();radar();petals(dt);TL.visible=run;HOE.visible=sel==0;AXE.visible=sel==1;if(swing>0)swing-=dt;TL.rotation.x=-.35-(swing>0?Math.sin(swing/.35*Math.PI)*.9:0);
if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}ren.render(sc,cam);requestAnimationFrame(loop)})(last);
</script></body></html>
