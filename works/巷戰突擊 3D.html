<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>巷戰突擊 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: title row above a 16:10 first-person viewport; HUD, crosshair and overlays live inside the viewport so fullscreen keeps them. Deliberately single dark look (night alley). */
:root {
  --bg: #101315;
  --panel: #171b1e;
  --line: #2a3136;
  --fg: #e8e4da;
  --muted: #8b949a;
  --accent: #ffb020;
  --hp: #4ad2c0;
  --enemy: #e5484d;
  --bone: #e8dfc6;
  --glow: #7ff5d0;
  --display: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--display); font-size: 1.5rem; letter-spacing: 0.08em; margin: 0; font-weight: 700; text-wrap: balance; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top small { color: var(--muted); flex: 1 1 200px; min-width: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button { font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; font-size: 1rem; background: var(--accent); color: #1a1205; border: 0; padding: 10px 22px; border-radius: 3px; cursor: pointer; align-self: flex-start; }
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: default; }
.tool { background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 5px 12px; font-size: 0.85rem; letter-spacing: 0.06em; }
.tool:hover { border-color: var(--accent); filter: none; }

.stage { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #0b0f12; aspect-ratio: 16 / 10; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage:fullscreen { aspect-ratio: auto; border: 0; border-radius: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
.lbl { font-size: 0.7rem; letter-spacing: 0.16em; color: var(--muted); }
.num { font-weight: 700; font-variant-numeric: tabular-nums; }
.hp { position: absolute; left: 14px; top: 12px; width: min(36%, 240px); }
.hp .num { font-size: 1.05rem; margin-left: 6px; }
.bar { height: 9px; background: rgba(8, 10, 11, 0.7); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width 0.12s linear; }
.bar i.low { background: var(--enemy); }
.tr { position: absolute; right: 14px; top: 10px; text-align: right; display: flex; flex-direction: column; gap: 0; }
.tr .num { font-size: 1.15rem; margin-left: 6px; }
.bl { position: absolute; left: 14px; bottom: 12px; }
.wname { font-size: 0.8rem; letter-spacing: 0.14em; color: var(--accent); }
.wname.bone { color: var(--glow); }
.ammo { font-size: 2.1rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ammo small { font-size: 1rem; color: var(--muted); font-weight: 500; }
.banner { position: absolute; left: 0; right: 0; top: 16%; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.8rem); letter-spacing: 0.12em; opacity: 0; transition: opacity 0.4s; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); pointer-events: none; }
.banner.show { opacity: 1; }
.note { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 0.8rem; color: var(--muted); pointer-events: none; padding: 0 16px; }
.cross { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; }
.cross i { position: absolute; background: rgba(232, 228, 218, 0.9); box-shadow: 0 0 2px rgba(0, 0, 0, 0.9); }
.cross i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 8px; }
.cross i:nth-child(2) { left: 12px; bottom: 0; width: 2px; height: 8px; }
.cross i:nth-child(3) { top: 12px; left: 0; width: 8px; height: 2px; }
.cross i:nth-child(4) { top: 12px; right: 0; width: 8px; height: 2px; }
.hitm { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; pointer-events: none; }
.hitm::before, .hitm::after { content: ""; position: absolute; left: 10px; top: -3px; width: 2px; height: 28px; background: #fff; box-shadow: 0 0 3px rgba(0, 0, 0, 0.9); }
.hitm::before { transform: rotate(45deg); }
.hitm::after { transform: rotate(-45deg); }
.hitm.on { opacity: 1; }
.hitm.kill::before, .hitm.kill::after { background: var(--enemy); }
.vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 140px 30px rgba(229, 72, 77, 0.85); }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 12, 13, 0.82); padding: 16px; overflow: auto; }
.card { max-width: 480px; text-align: left; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--display); font-size: 2rem; margin: 0; letter-spacing: 0.1em; text-wrap: balance; }
.card p { margin: 0; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; padding: 0; color: var(--muted); }
.keys dt { font-family: var(--display); color: var(--accent); font-weight: 500; }
.keys dd { margin: 0; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }

.touch { display: none; position: absolute; inset: 0; pointer-events: none; }
.stick { position: absolute; width: 100px; height: 100px; margin: -50px 0 0 -50px; border: 2px solid rgba(232, 228, 218, 0.35); border-radius: 50%; }
.stick i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(232, 228, 218, 0.5); }
.tb { position: absolute; pointer-events: auto; background: rgba(23, 27, 30, 0.7); color: var(--fg); border: 2px solid rgba(232, 228, 218, 0.4); border-radius: 50%; padding: 0; touch-action: none; }
.tb.fire { right: 16px; bottom: 16px; width: 84px; height: 84px; border-color: var(--accent); color: var(--accent); }
.tb.sm { width: 56px; height: 56px; font-size: 0.8rem; letter-spacing: 0; }
.tb.r { right: 112px; bottom: 20px; }
.tb.s { right: 28px; bottom: 112px; }
@media (pointer: coarse) { .touch { display: block; } .bl { bottom: 112px; } }
@media (max-width: 560px) {
  .stage { aspect-ratio: 3 / 4; }
  .card h2 { font-size: 1.5rem; }
  .overlay { padding: 10px; align-items: flex-start; }
  .card { gap: 8px; font-size: 0.9rem; }
}
</style>

<div class="wrap">
  <div class="top">
    <h1>巷戰突擊 3D</h1>
    <small>第一人稱，守住夜裡的巷子</small>
    <div class="tools">
      <button class="tool" id="snd" type="button">音效：開</button>
      <button class="tool" id="fs" type="button">全螢幕</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>

    <div class="hud">
      <div class="hp"><span class="lbl">生命</span><span class="num" id="hpNum">100</span><div class="bar"><i id="hpFill"></i></div></div>
      <div class="tr">
        <div><span class="lbl">波次</span><span class="num" id="wave">1</span></div>
        <div><span class="lbl">分數</span><span class="num" id="score">0</span></div>
      </div>
      <div class="bl">
        <div class="wname" id="wname">標準步槍</div>
        <div class="ammo"><span id="ammo">30</span><small id="mag"> / 30</small></div>
      </div>
      <div class="note" id="note" hidden></div>
    </div>
    <div class="cross"><i></i><i></i><i></i><i></i></div>
    <div class="hitm" id="hitm"></div>
    <div class="vig" id="vig"></div>
    <div class="banner" id="banner"></div>

    <div class="touch" id="touch">
      <div class="stick" id="stick" hidden><i id="knob"></i></div>
      <button class="tb fire" id="bFire" type="button">射擊</button>
      <button class="tb sm r" id="bReload" type="button">換彈</button>
      <button class="tb sm s" id="bSwap" type="button">換槍</button>
    </div>

    <div class="overlay" id="menu">
      <div class="card">
        <h2>巷戰突擊 3D</h2>
        <p>你被困在夜裡的巷子中，敵人會從四面八方湧入。撐過越多波越好。</p>
        <dl class="keys">
          <dt>WASD</dt><dd>移動</dd>
          <dt>滑鼠</dt><dd>瞄準（點擊畫面鎖定滑鼠），左鍵射擊</dd>
          <dt>R</dt><dd>換彈</dd>
          <dt>Q / 1 / 2</dt><dd>切換標準步槍與骨爪步槍</dd>
          <dt>方向鍵</dt><dd>轉動視角（滑鼠無法鎖定時使用）</dd>
          <dt>觸控</dt><dd>左半邊拖曳移動，右半邊拖曳轉視角，用按鈕射擊</dd>
        </dl>
        <p class="hint">爆頭傷害加倍。骨爪步槍的骨刺能穿透一名敵人。</p>
        <button id="start" type="button">開始戰鬥</button>
        <p class="hint" id="best"></p>
      </div>
    </div>
    <div class="overlay" id="pause" hidden>
      <div class="card">
        <h2>已暫停</h2>
        <button id="resume" type="button">繼續</button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2>撤退失敗</h2>
        <p id="result"></p>
        <button id="again" type="button">再來一局</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), canvas = $('gl'), menu = $('menu'), overEl = $('over'), pauseEl = $('pause');

  function fail(msg) {
    var p = document.createElement('p'); p.className = 'hint'; p.textContent = msg;
    menu.querySelector('.card').appendChild(p);
    $('start').disabled = true;
  }
  if (typeof THREE === 'undefined') { fail('3D 函式庫載入失敗，請重新整理頁面。'); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (err) { fail('這個瀏覽器無法使用 WebGL，沒辦法執行 3D 遊戲。'); return; }

  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2));

  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var best = 0;
  try { best = parseInt(localStorage.getItem('alley3d-best') || '0', 10) || 0; } catch (e) {}
  function showBest() { $('best').textContent = best > 0 ? '最高分：' + best : ''; }
  showBest();

  /* ------------------------------------------------------------ scene */
  var ARENA = 18, EYE = 1.65;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f12);
  scene.fog = new THREE.FogExp2(0x0b0f12, 0.032);
  var camera = new THREE.PerspectiveCamera(62, 1.6, 0.05, 120);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0x7f9bbd, 0x2a2018, 0.7));
  var moon = new THREE.DirectionalLight(0xa9c2e2, 0.6);
  moon.position.set(-12, 26, 10);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -24; moon.shadow.camera.right = 24;
  moon.shadow.camera.top = 24; moon.shadow.camera.bottom = -24;
  moon.shadow.camera.near = 5; moon.shadow.camera.far = 70;
  moon.shadow.bias = -0.0006;
  scene.add(moon);

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  /* ------------------------------------------------------------ textures */
  function mkCanvas(w, h, fn) { var c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
  function mkTex(c, rx, ry) {
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
    t.anisotropy = 4;
    return t;
  }

  var groundTex = mkTex(mkCanvas(1024, 1024, function (g, w, h) {
    var r = lcg(11), i, j;
    g.fillStyle = '#23282c'; g.fillRect(0, 0, w, h);
    for (i = 0; i < 16000; i++) {
      var v = Math.floor(r() * 70 + 20);
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',' + (0.1 + r() * 0.25) + ')';
      g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
    }
    g.strokeStyle = '#14171a'; g.lineWidth = 1.5;
    for (i = 0; i < 26; i++) {
      var x = r() * w, y = r() * h;
      g.beginPath(); g.moveTo(x, y);
      for (j = 0; j < 6; j++) { x += (r() - 0.5) * 90; y += (r() - 0.5) * 90; g.lineTo(x, y); }
      g.stroke();
    }
    for (i = 0; i < 5; i++) {
      g.fillStyle = 'rgba(80,100,120,0.28)';
      g.beginPath(); g.ellipse(r() * w, r() * h, 40 + r() * 70, 20 + r() * 40, r() * 3, 0, 6.283); g.fill();
    }
    g.fillStyle = 'rgba(255,176,32,0.5)';
    for (i = 0; i < w; i += 96) g.fillRect(i, h / 2 - 4, 56, 8);
    g.fillStyle = '#30373b';
    g.fillRect(0, 0, w, 36); g.fillRect(0, h - 36, w, 36); g.fillRect(0, 0, 36, h); g.fillRect(w - 36, 0, 36, h);
  }), 1, 1);

  var wallR = lcg(5), wallLit = [];
  (function () { for (var i = 0; i < 3; i++) wallLit.push(wallR() < 0.45); })();
  var wallDiffuse = mkCanvas(1024, 256, function (g, w, h) {
    var r = lcg(23), x, y, i;
    g.fillStyle = '#3b3230'; g.fillRect(0, 0, w, h);
    for (y = 0; y < h; y += 16) {
      for (x = (y / 16) % 2 ? -32 : 0; x < w; x += 64) {
        var v = Math.floor(r() * 24);
        g.fillStyle = 'rgb(' + (52 + v) + ',' + (42 + v) + ',' + (40 + v) + ')';
        g.fillRect(x + 1, y + 1, 62, 14);
      }
    }
    for (i = 0; i < 3; i++) {
      var cx = w * (i * 2 + 1) / 6;
      g.fillStyle = '#20262a'; g.fillRect(cx - 62, 40, 124, 170);
      g.fillStyle = wallLit[i] ? '#caa56a' : '#0d1114'; g.fillRect(cx - 52, 50, 104, 150);
      g.fillStyle = '#20262a'; g.fillRect(cx - 52, 122, 104, 6); g.fillRect(cx - 2, 50, 4, 150);
    }
  });
  var wallEmissive = mkCanvas(1024, 256, function (g, w, h) {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 3; i++) {
      if (!wallLit[i]) continue;
      var cx = w * (i * 2 + 1) / 6;
      g.fillStyle = '#ffb870'; g.fillRect(cx - 52, 50, 104, 150);
      g.fillStyle = '#000'; g.fillRect(cx - 52, 122, 104, 6); g.fillRect(cx - 2, 50, 4, 150);
    }
  });

  var crateTex = mkTex(mkCanvas(256, 256, function (g, w, h) {
    var r = lcg(31), i;
    g.fillStyle = '#6b4e30'; g.fillRect(0, 0, w, h);
    for (i = 0; i < 8; i++) {
      var v = Math.floor(r() * 26);
      g.fillStyle = 'rgb(' + (110 + v) + ',' + (82 + v) + ',' + (50 + v) + ')';
      g.fillRect(0, i * 32 + 1, w, 30);
    }
    g.strokeStyle = '#3a2a18'; g.lineWidth = 12; g.strokeRect(6, 6, w - 12, h - 12);
    g.lineWidth = 10; g.beginPath(); g.moveTo(10, 10); g.lineTo(w - 10, h - 10); g.moveTo(w - 10, 10); g.lineTo(10, h - 10); g.stroke();
  }));

  /* ------------------------------------------------------------ world */
  function stdMat(c, r, m) { return new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.8 : r, metalness: m || 0 }); }

  var ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2 + 2, ARENA * 2 + 2), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  var wallMat = new THREE.MeshStandardMaterial({ map: mkTex(wallDiffuse, 3, 4.6), emissive: 0xffffff, emissiveMap: mkTex(wallEmissive, 3, 4.6), emissiveIntensity: 0.95, roughness: 0.95 });
  (function () {
    var specs = [[0, -ARENA - 0.5, ARENA * 2 + 2, 1], [0, ARENA + 0.5, ARENA * 2 + 2, 1], [-ARENA - 0.5, 0, 1, ARENA * 2 + 2], [ARENA + 0.5, 0, 1, ARENA * 2 + 2]];
    specs.forEach(function (s) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(s[2], 14, s[3]), wallMat);
      m.position.set(s[0], 7, s[1]);
      m.receiveShadow = true;
      scene.add(m);
    });
  })();

  var OBST = [];
  var crateGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
  var crateMat = new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.9 });
  function addCrates(cx, cz, nx, nz) {
    var s = 1.1, w = nx * s, d = nz * s, i, j, k;
    for (i = 0; i < nx; i++) for (j = 0; j < nz; j++) for (k = 0; k < 2; k++) {
      var m = new THREE.Mesh(crateGeo, crateMat);
      m.position.set(cx - w / 2 + s / 2 + i * s, s / 2 + k * s, cz - d / 2 + s / 2 + j * s);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
    }
    OBST.push({ x: cx, z: cz, w: w, d: d, h: 2.2 });
  }
  function addDumpster(cx, cz, w, d) {
    var body = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, d), stdMat(0x2d4a3a, 0.7, 0.2));
    body.position.set(cx, 0.75, cz); body.castShadow = true; body.receiveShadow = true; scene.add(body);
    var lid = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.12, d + 0.1), stdMat(0x1d2f26, 0.6, 0.3));
    lid.position.set(cx, 1.56, cz); lid.castShadow = true; scene.add(lid);
    OBST.push({ x: cx, z: cz, w: w, d: d, h: 1.7 });
  }
  addCrates(-8, -6, 3, 2);
  addCrates(8, -6, 3, 2);
  addCrates(-8, 7, 3, 2);
  addCrates(8, 7, 3, 2);
  addCrates(0, 0, 4, 3);
  addDumpster(-3, -12.5, 3.2, 1.6);
  addDumpster(4, 13.5, 3.2, 1.6);
  addDumpster(-14, 1, 1.6, 3.2);

  [[-15, -15], [15, -15], [-15, 15], [15, 15]].forEach(function (p) {
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 5, 8), stdMat(0x1c2024, 0.6, 0.5));
    pole.position.set(p[0], 2.5, p[1]); pole.castShadow = true; scene.add(pole);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd9a0 }));
    bulb.position.set(p[0], 5.1, p[1]); scene.add(bulb);
    var l = new THREE.PointLight(0xffc27a, 1.0, 24, 2);
    l.position.set(p[0], 4.9, p[1]); scene.add(l);
  });

  var boxCache = {};
  function boxGeo(w, h, d) { var k = w + '|' + h + '|' + d; return boxCache[k] || (boxCache[k] = new THREE.BoxGeometry(w, h, d)); }

  function pushOut(o) {
    var i, b, cx, cz, dx, dz, d2, d, k, px, pz;

  }
  $('start').addEventListener('click', begin);
  $('again').addEventListener('click', begin);
  $('resume').addEventListener('click', function () { state = 'play'; pauseEl.hidden = true; lock(); });

  function look(dx, dy) {
    P.yaw -= dx * SENS;
    P.pitch = clamp(P.pitch - dy * SENS, -1.4, 1.4);
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (state === 'play') {
      if (k === 'r') startReload();
      if (k === '1' || k === '2') switchWeapon(+k - 1);
      if (k === 'q') switchWeapon(1 - P.weapon);
      if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();
    } else if ((k === 'enter' || k === ' ') && state !== 'pause' && document.activeElement === document.body) {
      e.preventDefault(); begin();
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', function () { keys = {}; mouseFire = false; rightLook = false; });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse') {
      if (e.button === 0) mouseFire = true;
      if (e.button === 2) rightLook = true;
      try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
      if (!locked && !coarse) lock();
      return;
    }
    var r = canvas.getBoundingClientRect();
    try { canvas.setPointerCapture(e.pointerId); } catch (x2) {}
    if (e.clientX - r.left < r.width * 0.45) {
      if (!stick) {
        stick = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, x: e.clientX - r.left, y: e.clientY - r.top };
        var s = $('stick'); s.hidden = false; s.style.left = stick.ox + 'px'; s.style.top = stick.oy + 'px';
        $('knob').style.transform = 'translate(0,0)';
      }
    } else if (!lookT) {
      lookT = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse') {
      if (locked || rightLook) look(e.movementX || 0, e.movementY || 0);
      return;
    }
    var r = canvas.getBoundingClientRect();
    if (stick && stick.id === e.pointerId) {
      stick.x = e.clientX - r.left; stick.y = e.clientY - r.top;
      var dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy), kk = l > 50 ? 50 / l : 1;
      $('knob').style.transform = 'translate(' + dx * kk + 'px,' + dy * kk + 'px)';
    } else if (lookT && lookT.id === e.pointerId) {
      look((e.clientX - lookT.x) * 1.6, (e.clientY - lookT.y) * 1.6);
      lookT.x = e.clientX; lookT.y = e.clientY;
    }
  });
  function release(e) {
    if (e.pointerType === 'mouse') {
      if (e.button === 0) mouseFire = false;
      if (e.button === 2) rightLook = false;
    } else if (stick && stick.id === e.pointerId) { stick = null; $('stick').hidden = true; }
    else if (lookT && lookT.id === e.pointerId) lookT = null;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  function hold(id, on, off) {
    var b = $(id);
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); on(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, function () { off(); }); });
  }
  hold('bFire', function () { touchFire = true; }, function () { touchFire = false; });
  hold('bReload', function () { if (state === 'play') startReload(); }, function () {});
  hold('bSwap', function () { if (state === 'play') switchWeapon(1 - P.weapon); }, function () {});

  $('snd').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = '音效：' + (soundOn ? '開' : '關');
    this.blur();
  });
  var fsBtn = $('fs');
  if (!stage.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener('click', function () {
    try { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen(); } catch (e) {}
    this.blur();
  });

  reset();
  state = 'menu';
  requestAnimationFrame(frame);
})();
</script>

</body></html>
