</style></head><body><div class="w">
<h1>🎮 音樂冒險島</h1>
<details class="g"><summary>📖 怎麼玩？（點一下可以收起來）</summary><div class="st"><div><b>① 選樂器</b><br>左邊每一列是一個樂器，點下拉選單可以換聲音。</div><div><b>② 畫音符</b><br>在右邊方格點一下就有音符，往右拖會變長，再點一下就擦掉。越上面的音越高喔！</div><div><b>③ 按播放</b><br>按「▶ 播放」聽聽看！也可以用電腦鍵盤 A S D F 彈奏。</div></div></details>
<div class="gm"><div class="gh"><span id="lv"></span><span id="stc"></span></div><div class="pb"><i id="pbi"></i></div><div style="font-size:13px;margin-bottom:6px">🎯 完成任務，拿星星升級！</div><div class="qs" id="qs"></div></div><div id="toast"></div>
<div id="pgo"><select id="pgs"><option value="">🎼 目前編輯的歌</option><option value="0">💖 甜心閃閃</option><option value="1">😎 Girl Crush</option><option value="2">🌊 夏日海邊</option></select><button id="pgx">✕ 離開</button><canvas id="pgc"></canvas></div>
<div class="bar">
<button class="p" id="pl">▶ 播放</button><button id="rc" title="播放時按電腦鍵盤，音符會自動記下來">🔴 錄音</button><button id="pgb" class="p" style="background:#ec6fa8;border-color:#ec6fa8">🎹 鋼琴遊戲</button>

<label>音符長短 <select id="ln"><option value="1">很短</option><option value="2" selected>短</option><option value="4">中</option><option value="8">長</option><option value="16">超長</option></select></label>
<label title="點到不好聽的音，會自動滑到好聽的音">好聽模式 <select id="sc"><option value="none">自由（所有音）</option><option value="pent">開心的音</option><option value="mpent" selected>帥氣的音（推薦）</option><option value="major">大調</option><option value="minor">小調</option><option value="blues">藍調</option></select></label>
</div>

<label>好聽模式的起點 <select id="rt"></select></label>
<label>回音 <input type="range" id="rv" min="0" max="1" step=".01" value=".25"></label>

</div></details>
<div class="bar">
<button id="demo">🎵 範例歌曲</button><select id="songs"><option value="">💖 K-pop 風格歌曲</option><option value="0">💖 甜心閃閃（可愛風）</option><option value="1">😎 Girl Crush（強勢風）</option><option value="2">🌊 夏日海邊（清爽風）</option></select><button id="clr">🧽 擦掉這一軌</button><button id="clrall">🗑 全部擦掉</button><button id="sv">💾 存起來</button><button id="ld">📂 打開存檔</button><span id="msg" style="color:var(--mu);font-size:14px"></span>
</div>
<div class="main"><div><h3>① 選樂器</h3><div id="tl"></div><button id="add" style="margin-top:6px;width:100%">＋ 再加一個樂器</button></div><div><h3>② 在格子裡點一下，畫出音符 👇</h3><div id="wr"><canvas id="cv"></canvas></div></div></div>
<p class="hint">💡 小提醒：點格子最左邊的琴鍵可以先聽聽看；按空白鍵可以播放或停止；按「🔴 錄音」後再播放，彈電腦鍵盤的音就會自動記下來。</p>
</div>
<script>

function voice(c,out,P,f,t,d,v){

 g.connect(F);F.connect(out);let LG=null;
 if(P.vib){const l=c.createOscillator();LG=c.createGain();l.frequency.value=5.2;LG.gain.value=14;l.connect(LG);l.start(t);l.stop(end+.05)}
 for(const [ty,m,gn,dt] of P.w){const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=f*m;o.detune.value=dt||0;og.gain.value=gn;
  if(LG)LG.connect(o.detune);
  if(P.fm){const mo=c.createOscillator(),mg=c.createGain(),D=P.fm[1]*f*P.fm[0];mo.frequency.value=f*P.fm[0];mg.gain.setValueAtTime(D,t);mg.gain.exponentialRampToValueAtTime(D*.05,t+P.dec);mo.connect(mg);mg.connect(o.frequency);mo.start(t);mo.stop(end+.05)}

 if(k==0)T(150,42,G(1,.4),.4);
 else if(k==1){N('highpass',1800,G(.7,.2),.2);T(220,120,G(.5,.12),.12)}

function tick(){const sd=60/S.bpm/4,n=S.bars*16;while(nextT<AC.currentTime+.15){
 for(const T of S.tr){if(T.mute)continue;const P=INST[T.inst];for(const o of T.notes)if(o.s===cur)P.drum?drum(AC,B.inp,o.p,nextT,T.vol):voice(AC,B.inp,P,mtof(o.p),nextT,o.l*sd,T.vol)}

 const T=trk(),D=isD(T),R=D?8:36,rh=D?34:16,n=S.bars*16,W=KW+n*CW,H=R*rh,dpr=devicePixelRatio||1;

 x.setTransform(dpr,0,0,dpr,0,0);const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim(),sc=SC[$('sc').value],rt=+$('rt').value;

 S.tr.forEach(U=>{if(U!==T)U.notes.forEach(o=>note(U,o,.22))});T.notes.forEach(o=>note(T,o,1,1));
 if(playing&&vstep>=0){x.fillStyle=g('--ac');x.globalAlpha=.28;x.fillRect(KW+vstep*CW,0,CW,H);x.globalAlpha=1}}
function pos(e){const r=cv.getBoundingClientRect(),T=trk(),D=isD(T),R=D?8:36,rh=D?34:16,px=e.clientX-r.left,row=Math.floor((e.clientY-r.top)/rh);return{px,D,R,p:D?row:T.oct+R-1-row,s:Math.floor((px-KW)/CW)}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{const T=trk(),q=pos(e);if(q.p<0||(q.D&&q.p>7))return;if(q.px<KW){preview(q.p);return}

cv.addEventListener('pointerup',()=>drag=null);
