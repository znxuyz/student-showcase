<style>
/* Layout: the capsule machine (canvas dome + base + one big button) on the left; prize pool, prize editor and draw log on the right; stacks to one column on phones. */
:root {
  --bg: #E3EAF3;
  --surface: #FFFFFF;
  --surface-2: #EEF3F9;
  --ink: #13203A;
  --ink-2: #4B5A75;
  --line: #CAD6E5;
  --accent: #D63A2F;
  --accent-deep: #9E2A22;
  --accent-ink: #FFFFFF;
  --gold: #E0A100;
  --gold-ink: #3A2600;
  --glass: rgba(255, 255, 255, .5);
  --glass-line: #8EA3C0;
  --veil: rgba(227, 234, 243, .86);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1525;
    --surface: #162238;
    --surface-2: #1D2B46;
    --ink: #E8EEF9;
    --ink-2: #9DAEC9;
    --line: #2B3C5C;
    --accent: #FF7466;
    --accent-deep: #BE4A3E;
    --accent-ink: #2A0B08;
    --gold: #FFC83D;
    --gold-ink: #3A2600;
    --glass: rgba(160, 190, 235, .13);
    --glass-line: #5F7BA8;
    --veil: rgba(13, 21, 37, .82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1525;
  --surface: #162238;
  --surface-2: #1D2B46;
  --ink: #E8EEF9;
  --ink-2: #9DAEC9;
  --line: #2B3C5C;
  --accent: #FF7466;
  --accent-deep: #BE4A3E;
  --accent-ink: #2A0B08;
  --gold: #FFC83D;
  --gold-ink: #3A2600;
  --glass: rgba(160, 190, 235, .13);
  --glass-line: #5F7BA8;
  --veil: rgba(13, 21, 37, .82);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--font);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.page { max-width: 1040px; margin-inline: auto; display: grid; gap: 28px; }
header h1 {
  margin: 0;
  font-size: clamp(32px, 6vw, 48px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: .04em;
  text-wrap: balance;
}
header p { margin: 8px 0 0; color: var(--ink-2); }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
  gap: 36px;
  align-items: start;
}
@media (max-width: 780px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .machine { max-width: 420px; width: 100%; margin-inline: auto; }
}
.machine { padding-bottom: 8px; min-width: 0; }
.stage { position: relative; }
canvas#cv { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; max-width: 100%; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.go {
  margin-top: 14px;
  width: 100%;
  min-height: 64px;
  border: 0;
  border-radius: 18px;
  background: var(--accent);
  color: var(--accent-ink);
  font: 900 22px/1 var(--font);
  letter-spacing: .2em;
  box-shadow: 0 6px 0 var(--accent-deep);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.go:disabled { opacity: .62; cursor: default; }

.side {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  display: grid;
  gap: 24px;
  min-width: 0;
}
.side h2, .edit summary { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .06em; }
.meta { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }

.prizes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
.prize {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 10px 6px;
  border-top: 1px solid var(--line);
  border-radius: 10px;
  transition: background .4s;
}
.prize:first-child { border-top-color: transparent; }
.pic {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--pc); color: #fff;
  display: grid; place-items: center;
}
.pic svg { width: 22px; height: 22px; }
.pn { display: grid; min-width: 0; }
.pn b { font-weight: 700; overflow-wrap: anywhere; }
.pn i { font-style: normal; font-size: 12px; letter-spacing: .1em; color: var(--ink-2); }
.pcount { font: 500 14px var(--mono); color: var(--ink-2); white-space: nowrap; }
.prize.out { opacity: .45; }
.prize.hit { background: var(--surface-2); }

.controls {
  display: flex; flex-wrap: wrap; gap: 12px 18px;
  align-items: center;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
}
.controls .ghost { margin-left: auto; }
.sw { display: flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; }
.sw input { width: 20px; height: 20px; accent-color: var(--accent); }
.ghost {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 12px; padding: 8px 14px; font: 700 14px var(--font); cursor: pointer;
}
.ghost:disabled, .sw input:disabled, .in:disabled { opacity: .5; cursor: default; }

.edit summary { cursor: pointer; }
.edit .meta { margin-top: 8px; }
.edit fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.erows { margin-top: 8px; display: grid; }
.erow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.erow:first-child { border-top-color: transparent; }
.edot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.in {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 10px; padding: 8px 10px; font: 500 15px var(--font); min-width: 0;
}
.ename { flex: 1 1 140px; }
.qtyl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
.eqty { width: 76px; font-family: var(--mono); }
.ebig { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.ebig input { width: 18px; height: 18px; accent-color: var(--gold); }
.edel { margin-left: auto; padding: 6px 12px; }
.eactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

.hist { list-style: none; margin: 10px 0 0; padding: 0; max-height: 264px; overflow-y: auto; display: grid; }
.hist li {
  display: grid; grid-template-columns: 38px 12px minmax(0, 1fr) auto;
  gap: 10px; align-items: center;
  padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px;
}
.hist li:first-child { border-top-color: transparent; }
.hist .n, .hist time { font: 500 13px var(--mono); color: var(--ink-2); }
.hist .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); }
.hist .nm { overflow-wrap: anywhere; font-weight: 500; }
.star {
  margin-left: 8px; padding: 1px 8px; border-radius: 999px;
  background: var(--gold); color: var(--gold-ink); font-size: 12px; font-weight: 700; letter-spacing: .1em;
}
.empty { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }

.veil {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: var(--veil);
  border-radius: 20px; padding: 16px;
}
.result {
  width: min(100%, 340px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 26px 22px 20px;
  text-align: center;
  display: grid; gap: 8px; justify-items: center;
  box-shadow: 0 18px 40px rgba(10, 20, 40, .24);
  animation: pop .32s cubic-bezier(.2, 1.3, .4, 1);
}
.result.big { border: 3px solid var(--gold); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 26%, transparent), 0 18px 40px rgba(10, 20, 40, .28); }
.ricon {
  width: 84px; height: 84px; border-radius: 50%;
  background: var(--pc); color: #fff;
  display: grid; place-items: center;
}
.ricon svg { width: 44px; height: 44px; }
.rsub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; letter-spacing: .2em; }
.rname { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.rtag { padding: 2px 14px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-size: 14px; font-weight: 900; letter-spacing: .3em; }
.ractions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
.primary {
  border: 0; border-radius: 12px; padding: 10px 18px;
  background: var(--accent); color: var(--accent-ink);
  font: 900 15px var(--font); letter-spacing: .08em; cursor: pointer;
}
@keyframes pop { from { transform: scale(.86); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .result { animation: none; }
  .go, .prize { transition: none; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="page">
  <header>
    <h1>幸運抽獎機</h1>
    <p>按下按鈕就開始轉。獎品和機率都能自己改,辦活動也能用。</p>
  </header>

  <div class="layout">
    <section class="machine" aria-label="抽獎機">
      <div class="stage">
        <canvas id="cv" width="400" height="500" role="img" aria-label="裝滿彩色膠囊的抽獎機"></canvas>
        <div class="veil" id="veil" hidden>
          <div class="result" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="rname">
            <div class="ricon" id="ricon"></div>
            <p class="rsub" id="rsub">恭喜抽中</p>
            <h3 class="rname" id="rname"></h3>
            <div class="rtag" id="rtag" hidden>頭獎</div>
            <div class="ractions">
              <button class="primary" id="again" type="button">再抽一次</button>
              <button class="ghost" id="closeBtn" type="button">關閉</button>
            </div>
          </div>
        </div>
      </div>
      <button class="go" id="go" type="button">轉動抽獎</button>
    </section>

    <aside class="side">
      <section>
        <h2>獎品池</h2>
        <p class="meta" id="poolMeta"></p>
        <ul class="prizes" id="prizeList"></ul>
        <div class="controls">
          <label class="sw" for="deduct"><input type="checkbox" id="deduct"> 抽中後扣除數量</label>
          <label class="sw" for="sound"><input type="checkbox" id="sound"> 音效</label>
          <button class="ghost" id="resetBtn" type="button">重設</button>
        </div>
      </section>

      <details class="edit" id="editor">
        <summary>編輯獎品</summary>
        <p class="meta">數量越多,抽中機率越高。修改數量會把該獎品的剩餘數量重設為新數量。最多 12 項。</p>
        <fieldset id="editFs">
          <div class="erows" id="erows"></div>
          <div class="eactions">
            <button class="ghost" id="addBtn" type="button">新增獎品</button>
            <button class="ghost" id="defaultBtn" type="button">恢復預設獎品</button>
          </div>
        </fieldset>
      </details>

      <section>
        <h2>抽獎紀錄</h2>
        <ol class="hist" id="history"></ol>
        <p class="empty" id="emptyHist">還沒有紀錄,按下「轉動抽獎」試試手氣。</p>
      </section>
    </aside>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>

    pop: '<rect x="7" y="2.5" width="10" height="13" rx="5"/><path d="M12 15.5v6"/>',

      var ok = o.prizes.every(function (p) {

  }

  var cfg = loadCfg();

  var phase = "idle", t0 = 0, chosen = -1, drawNo = 0, nextTick = 0;

    if (e.target.classList.contains("eqty")) {
      var q = Math.round(Number(e.target.value));
      if (!isFinite(q)) q = 0;
      p.qty = Math.max(0, Math.min(999, q));
      p.left = p.qty;
      e.target.value = p.qty;
      rebuild(); saveCfg();
    } else if (e.target.classList.contains("ebigc")) {
      p.big = e.target.checked;
      renderPrizes(); saveCfg();
    }
  });
  erows.addEventListener("click", function (e) {
    var btn = e.target.closest(".edel");
    if (!btn || prizes.length <= 1) return;
    var p = rowPrize(btn); if (!p) return;
    prizes = prizes.filter(function (x) { return x !== p; });
    renderEditor(); rebuild(); saveCfg();
  });
  $("addBtn").addEventListener("click", function () {
    if (prizes.length >= MAXP) return;
    prizes.push(mk({ name: "新獎品", qty: 1, big: false, icon: "gift", color: unusedColor() }, prizes.length));
    renderEditor(); rebuild(); saveCfg();
    var inp = $("en" + prizes[prizes.length - 1].id);
    if (inp) { inp.focus(); inp.select(); }
  });
  $("defaultBtn").addEventListener("click", function () {
    prizes = DEFAULTS.map(mk);
    hist = []; drawNo = 0;
    renderEditor(); rebuild(); renderHist(); saveCfg();
  });

  goBtn.addEventListener("click", startDraw);
  again.addEventListener("click", function () {
    if (totalW() > 0) startDraw(); else { resetAll(); goBtn.focus(); }
  });
  $("closeBtn").addEventListener("click", closeResult);
  resetBtn.addEventListener("click", resetAll);
  deductBox.addEventListener("change", function () {
    if (phase !== "idle") return;
    deduct = deductBox.checked; restock();
    rebuild(); saveCfg();
  });
  soundBox.addEventListener("change", function () {
    soundOn = soundBox.checked;
    if (!soundOn) motorStop();
    saveCfg();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !veil.hidden) closeResult(); });

  makeBalls(); renderPrizes(); renderEditor(); renderHist(); updateButton();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
