<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>屋頂狂奔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  /* Layout: full-bleed WebGL canvas, HUD pinned to the top corners, a single card at the bottom-left for menus, touch pad at the bottom on phones. */
  :root {
    --ink: #14111f;
    --paper: #f3ecf4;
    --muted: #b9aecb;
    --hot: #ff6a2b;
    --lemon: #ffd23f;
    --glass: rgba(20, 17, 31, 0.62);
    --line: rgba(255, 255, 255, 0.22);
    --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(20, 17, 31, 0.7), 0 2px 12px rgba(20, 17, 31, 0.55);
  }
  .hud .dist { font-family: var(--font-num); font-weight: 700; font-size: clamp(44px, 9vw, 72px); line-height: 0.95; font-variant-numeric: tabular-nums; }
  .hud .dist small { font-size: 0.4em; margin-left: 4px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
  .hud .sub { display: flex; gap: 14px; font-family: var(--font-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .hud .sub .coin { color: var(--lemon); }
  .hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .hud .speed { font-family: var(--font-num); font-weight: 600; font-size: 22px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .icon-btn {
    pointer-events: auto; cursor: pointer;
    font: 700 13px var(--font-display); color: var(--paper);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  }
  .icon-btn:focus-visible, .btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }

  .screen {
    position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(20, 17, 31, 0.78), rgba(20, 17, 31, 0) 70%);
  }
  .card { width: min(460px, 100%); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card h1 { margin: 0; font-weight: 900; font-size: clamp(52px, 12vw, 92px); line-height: 1; letter-spacing: 0.02em; text-wrap: balance; text-shadow: 0 4px 0 var(--hot); }
  .card h2 { margin: 0; font-weight: 900; font-size: clamp(34px, 8vw, 52px); line-height: 1.05; text-wrap: balance; }
  .card p { margin: 0; color: var(--paper); font-size: 16px; line-height: 1.6; max-width: 36ch; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: 15px; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .keys b { font-family: var(--font-num); font-weight: 700; font-size: 16px; letter-spacing: 0.05em; color: var(--lemon); white-space: nowrap; }
  .btn {
    align-self: flex-start; cursor: pointer; border: 0; border-radius: 10px;
    background: var(--hot); color: var(--ink); font: 900 20px var(--font-display);
    padding: 14px 28px; box-shadow: 0 5px 0 #a73a0c;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a73a0c; }
  .result { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 22px; justify-content: start; font-variant-numeric: tabular-nums; }
  .result div { display: flex; flex-direction: column; gap: 0; }
  .result span { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
  .result strong { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1.05; }
  .result .big strong { color: var(--lemon); }
  .reason { color: var(--muted); font-size: 15px; }

  .pad {
    position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .pad .grp { display: flex; gap: 12px; }
  .pad button {
    pointer-events: auto; touch-action: none; width: 76px; height: 76px; border-radius: 18px; cursor: pointer;
    background: var(--glass); border: 2px solid var(--line); color: var(--paper); font: 900 24px var(--font-display);
  }
  .pad button.on { background: var(--hot); color: var(--ink); }
  @media (pointer: coarse) { body.playing .pad { display: flex; } }
  @media (max-width: 420px) { .pad button { width: 66px; height: 66px; } .result { gap: 6px 16px; } .result strong { font-size: 34px; } }
  #nogl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--ink); }
</style>

<canvas id="gl" tabindex="0" aria-label="3D 跑酷遊戲畫面"></canvas>

<div class="hud" id="hud" hidden>
  <div>
    <div class="dist"><span id="dist">0</span><small>公尺</small></div>
    <div class="sub"><span class="coin">金幣 <span id="coins">0</span></span></div>
  </div>
  <div class="right">
    <button class="icon-btn" id="mute" type="button">音效：開</button>
    <div class="speed">名次 <span id="rank">1/3</span></div>
    <div class="speed"><span id="speed">0</span> km/h</div>
  </div>
</div>

<div class="screen" id="start">
  <div class="card">
    <h1>屋頂狂奔</h1>
    <p>白天的城市,一棟接一棟的屋頂。跑、跳、滑,越過缺口和障礙。速度會一直加快,缺口越來越寬,障礙也越來越密。兩位持槍的對手會跟你一起跑,看誰跑得遠。掉下去或撞上去就結束。</p>
    <div class="keys">
      <b>← → / A D</b><span>左右移動</span>
      <b>空白鍵 / ↑</b><span>跳躍,空中再按一次可二段跳</span>
      <b>↓ / S</b><span>滑行(鑽過橫桿),空中按下會快速下墜</span>
    </div>
    <button class="btn" id="go" type="button">開始跑酷</button>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <h2 id="reason">你停下來了</h2>
    <div class="result">
      <div class="big"><span>總分</span><strong id="rScore">0</strong></div>
      <div><span>距離</span><strong id="rDist">0</strong></div>
      <div><span>最佳</span><strong id="rBest">0</strong></div>
    </div>
    <div class="reason" id="rCoins"></div>
    <button class="btn" id="again" type="button">再跑一次</button>
  </div>
</div>

<div class="pad" id="pad">
  <div class="grp"><button type="button" data-k="left" aria-label="向左">左</button><button type="button" data-k="right" aria-label="向右">右</button></div>
  <div class="grp"><button type="button" data-k="slide" aria-label="滑行">滑</button><button type="button" data-k="jump" aria-label="跳躍">跳</button></div>
</div>

<div id="nogl" hidden><p>這個瀏覽器無法啟用 WebGL,請換一個瀏覽器再試。</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { $('nogl').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // ---------- constants ----------
  var G = 30, JUMP = 10.8, JUMP2 = 9.2;
  var SEG_W = 8, HALF = SEG_W / 2;
  var STAND_H = 1.85, SLIDE_H = 0.7;
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // ---------- scene ----------
  var FOG = 0xcfe6f6;
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(FOG, 50, 230);
  (function () {
    var c = document.createElement('canvas'); c.width = 4; c.height = 256;
    var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#3f86d6'); g.addColorStop(0.35, '#7fb8ee'); g.addColorStop(0.5, '#bfe0f7');
    g.addColorStop(0.62, '#e6f3fb'); g.addColorStop(1, '#bfe0f7');
    x.fillStyle = g; x.fillRect(0, 0, 4, 256);
    scene.background = new THREE.CanvasTexture(c);
  })();
  var camera = new THREE.PerspectiveCamera(62, 1, 0.1, 400);
  scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x6b6f80, 1.0));
  var sun = new THREE.DirectionalLight(0xfff1d6, 0.95); sun.position.set(-10, 25, 30);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
  var shc = sun.shadow.camera; shc.left = -26; shc.right = 26; shc.top = 26; shc.bottom = -26; shc.near = 1; shc.far = 120;
  scene.add(sun); scene.add(sun.target);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  // ---------- shared geometry / materials ----------
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  var matTop = new THREE.MeshLambertMaterial({ color: 0xbcc0cc });
  var matSide = new THREE.MeshLambertMaterial({ color: 0x7d829b });
  var bodyMats = [matSide, matSide, matTop, matSide, matSide, matSide];
  var matEdge = new THREE.MeshBasicMaterial({ color: 0xff7a3d });
  var matDash = new THREE.MeshLambertMaterial({ color: 0xc9cde0 });
  var matCrate = new THREE.MeshLambertMaterial({ color: 0xe8622a });
  var matHazard = new THREE.MeshBasicMaterial({ color: 0xffd23f });
  var matDark = new THREE.MeshLambertMaterial({ color: 0x2a2540 });
  var coinGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.08, 36); coinGeo.rotateZ(Math.PI / 2);
  var matCoin = new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x7a5a00 });

  function windowTexture(rx, ry) {
    var c = document.createElement('canvas'); c.width = 128; c.height = 128;
    var x = c.getContext('2d'); x.fillStyle = '#9aa6bf'; x.fillRect(0, 0, 128, 128);
    for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++) {
      var lit = Math.random() < 0.3;
      x.fillStyle = lit ? '#cfeaff' : (Math.random() < 0.5 ? '#6f93bd' : '#5d82ad');
      x.fillRect(i * 32 + 8, j * 32 + 7, 16, 18);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.repeat.set(rx, ry);
    return t;
  }
  var towerMats = {
    8: new THREE.MeshBasicMaterial({ map: windowTexture(2, 15), color: 0xe4eaf4 }),
    12: new THREE.MeshBasicMaterial({ map: windowTexture(3, 15), color: 0xd6deec })
  };

  // ---------- world ----------
  var segments = [], lastZmin = 0, lastTop = 0;

  function makeSegment(zMax, L, top, prevTop, prevZmin, safe) {
    var zMin = zMax - L, cz = (zMax + zMin) / 2;
    var g = new THREE.Group(); scene.add(g);
    var seg = { g: g, zMin: zMin, zMax: zMax, top: top, obs: [], coins: [] };
    function add(geo, mat, sx, sy, sz, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(px, py, pz); g.add(m); return m;
    }
    add(boxGeo, bodyMats, SEG_W, 40, L, 0, top - 20, cz);
    add(boxGeo, matEdge, 0.14, 0.04, L, -HALF + 0.12, top + 0.02, cz);
    add(boxGeo, matEdge, 0.14, 0.04, L, HALF - 0.12, top + 0.02, cz);
    for (var d = zMax - 2; d > zMin + 1; d -= 5) add(boxGeo, matDash, 0.18, 0.03, 1.8, 0, top + 0.015, d);

    // skyline
    for (var s = -1; s <= 1; s += 2) for (var i = 0; i < 2; i++) {
      var w = Math.random() < 0.5 ? 8 : 12;
      var bx = s * (rand(11, 34) + w / 2), bz = rand(zMin, zMax), by = top - rand(8, 34);
      add(boxGeo, towerMats[w], w, 60, w, bx, by - 30, bz);
    }

    if (!safe) {
      var c = zMax - 7;
      while (c > zMin + 4) {
        var r = Math.random();
        if (r < 0.2) {
          addCrate(seg, c, rand(-2.6, 2.6), rand(2, 3.2), 0.9);
        } else if (r < 0.35) {
          addCrate(seg, c, 0, SEG_W - 0.2, 0.8);
        } else if (r < 0.55) {
          addGate(seg, c);
        } else if (r < 0.78) {
          var off = rand(-1.3, 1.3), lx1 = off - 1.2, rx0 = off + 1.2;
          addCrate(seg, c, (-3.95 + lx1) / 2, lx1 + 3.95, 0.9);
          addCrate(seg, c, (rx0 + 3.95) / 2, 3.95 - rx0, 0.9);
        } else {
          addGate(seg, c);
          if (c - 4.5 > zMin + 3) addCrate(seg, c - 4.5, rand(-2, 2), 3, 0.9);
        }
        var spacing = Math.max(8, speed * 0.65) + rand(0, 4);
        var mid = c - spacing / 2;
        if (Math.random() < 0.8 && mid > zMin + 3) {
          var lane = [-2.4, 0, 2.4][Math.floor(Math.random() * 3)];
          for (var k = -2; k <= 2; k++) addCoin(seg, lane, top + 1.1, mid + k * 1.2);
        }
        c -= spacing;
      }
      // coin arc over the gap
      var n = 5;
      for (var q = 1; q <= n; q++) {
        var t = q / (n + 1);
        var gz = prevZmin + (zMax - prevZmin) * t;
        var gy = prevTop + (top - prevTop) * t + 1.0 + Math.sin(Math.PI * t) * 1.5;
        addCoin(seg, 0, gy, gz);
      }
    }
    g.children.forEach(function (m) {
      if (m.material === towerMats[8] || m.material === towerMats[12]) return;
      m.castShadow = m.material === matCrate || m.material === matHazard || m.material === matDark;
      m.receiveShadow = m.material === bodyMats;
    });
    segments.push(seg);
    lastZmin = zMin; lastTop = top;
    return seg;
  }

  function addCrate(seg, z, x, w, h) {
    var m = new THREE.Mesh(boxGeo, matCrate); m.scale.set(w, h, 1); m.position.set(x, seg.top + h / 2, z); seg.g.add(m);
    var s = new THREE.Mesh(boxGeo, matHazard); s.scale.set(w + 0.02, 0.1, 1.02); s.position.set(x, seg.top + h + 0.02, z); seg.g.add(s);
    seg.obs.push({ x0: x - w / 2, x1: x + w / 2, y0: seg.top, y1: seg.top + h, z0: z - 0.5, z1: z + 0.5 });
  }
  function addGate(seg, z) {
    var top = seg.top;
    [-1, 1].forEach(function (sd) {
      var p = new THREE.Mesh(boxGeo, matDark); p.scale.set(0.3, 2.6, 0.3); p.position.set(sd * 3.85, top + 1.3, z); seg.g.add(p);
    });
    var bar = new THREE.Mesh(boxGeo, matHazard); bar.scale.set(7.6, 0.6, 0.35); bar.position.set(0, top + 1.3, z); seg.g.add(bar);
    for (var i = -3; i <= 3; i += 2) {
      var st = new THREE.Mesh(boxGeo, matDark); st.scale.set(0.5, 0.62, 0.37); st.position.set(i, top + 1.3, z); seg.g.add(st);
    }
    seg.obs.push({ x0: -3.8, x1: 3.8, y0: top + 1.0, y1: top + 1.6, z0: z - 0.2, z1: z + 0.2 });
    seg.obs.push({ x0: 3.7, x1: 4.0, y0: top, y1: top + 2.6, z0: z - 0.2, z1: z + 0.2 });
    seg.obs.push({ x0: -4.0, x1: -3.7, y0: top, y1: top + 2.6, z0: z - 0.2, z1: z + 0.2 });
  }
  function addCoin(seg, x, y, z) {
    var m = new THREE.Mesh(coinGeo, matCoin); m.position.set(x, y, z); seg.g.add(m);
    seg.coins.push({ mesh: m, x: x, y: y, z: z, taken: false });
  }

  function addNextSegment() {
    var gap = rand(3.2, 4.4) + (speed - 16) * 0.3;
    var picks = [-2.2, -1.2, -0.6, 0, 0.8, 1.1, 1.3, 1.3, -1.5];
    var dTop = picks[Math.floor(Math.random() * picks.length)];
    if (lastTop > 4) dTop = -Math.abs(dTop) - 0.5;
    if (lastTop < -5) dTop = Math.abs(dTop) + 0.4;
    var newTop = lastTop + dTop;
    makeSegment(lastZmin - gap, rand(10, 18), newTop, lastTop, lastZmin, false);
  }
  function genAhead() { while (lastZmin > P.z - 170) addNextSegment(); }
  function cullBehind() {
    while (segments.length && segments[0].zMax < P.z - 45) { scene.remove(segments[0].g); segments.shift(); }
  }

  // ---------- player model ----------
  var playerG = new THREE.Group(); scene.add(playerG);
  var pivot = new THREE.Group(); pivot.position.y = 0.9; playerG.add(pivot);
  var bodyG = new THREE.Group(); bodyG.position.y = -0.9; pivot.add(bodyG);
  var mJacket = new THREE.MeshLambertMaterial({ color: 0x2c8fa8 });
  var mPants = new THREE.MeshLambertMaterial({ color: 0x23223a });
  var mShoe = new THREE.MeshLambertMaterial({ color: 0xff6a2b });
  var mHair = new THREE.MeshLambertMaterial({ color: 0x2a1a1a });
  var mSkin = new THREE.MeshLambertMaterial({ color: 0xf0c8a0 });
  var mPack = new THREE.MeshLambertMaterial({ color: 0xff6a2b });
  function part(geo, mat, sx, sy, sz, px, py, pz, parent) {
    var m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(px, py, pz); parent.add(m); return m;
  }
  part(boxGeo, mJacket, 0.7, 0.7, 0.38, 0, 1.15, 0, bodyG);
  part(boxGeo, mPack, 0.5, 0.55, 0.24, 0, 1.17, 0.3, bodyG);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 28, 20), mHair); head.position.set(0, 1.72, 0); bodyG.add(head);
  part(boxGeo, mSkin, 0.3, 0.1, 0.12, 0, 1.55, 0.02, bodyG);
  function limb(x, y, mat, w, len, shoe) {
    var piv = new THREE.Group(); piv.position.set(x, y, 0); bodyG.add(piv);
    part(boxGeo, mat, w, len, w + 0.04, 0, -len / 2, 0, piv);
    if (shoe) part(boxGeo, mShoe, w + 0.02, 0.14, w + 0.2, 0, -len + 0.05, -0.04, piv);
    else part(boxGeo, mSkin, w, 0.14, w, 0, -len + 0.03, 0, piv);
    return piv;
  }
  var legL = limb(-0.17, 0.8, mPants, 0.24, 0.8, true), legR = limb(0.17, 0.8, mPants, 0.24, 0.8, true);
  var armL = limb(-0.46, 1.46, mJacket, 0.2, 0.62, false), armR = limb(0.46, 1.46, mJacket, 0.2, 0.62, false);
  // pistol held in the right hand (arm local -y = barrel direction, +z = down when the arm is raised)
  var mGun = new THREE.MeshLambertMaterial({ color: 0x3a4052 }), mGrip = new THREE.MeshLambertMaterial({ color: 0x15151d });
  part(boxGeo, mGun, 0.1, 0.42, 0.13, 0, -0.76, 0, armR);
  part(boxGeo, mGrip, 0.09, 0.12, 0.24, 0, -0.64, 0.15, armR);
  part(boxGeo, mGrip, 0.06, 0.1, 0.06, 0, -0.97, 0, armR);
  part(boxGeo, mShoe, 0.03, 0.04, 0.04, 0, -0.6, -0.08, armR);
  playerG.traverse(function (o) { if (o.isMesh) o.castShadow = true; });

  // ---------- rivals ----------
  function buildRunner(jc, pc, mc) {

    }
  }

  var camPos = new THREE.Vector3(0, 4, 8), tmp = new THREE.Vector3(), tmpL = new THREE.Vector3(), fov = 62;
  function updateCamera(dt) {
    var k = 1 - Math.exp(-dt * 4);
    if (!(mode === 'dead' && fell)) camY += (lastGroundTop - camY) * k;
    if (mode === 'ready') {
      var a = clock * 0.4;
      tmp.set(P.x + Math.sin(a) * 4.6, camY + 1.7, P.z + Math.cos(a) * 4.6);
      tmpL.set(P.x, camY + 1.1, P.z);
    } else if (mode === 'play') {
      tmp.set(P.x * 0.55, camY + 3.1, P.z + 7.2);
      tmpL.set(P.x * 0.6, camY + 1.3, P.z - 10);
    } else {
      tmp.set(P.x * 0.55, camY + 3.1, camPos.z);
      tmpL.set(P.x, P.y + 1, P.z);
    }
    var kp = mode === 'play' ? 1 - Math.exp(-dt * 9) : 1 - Math.exp(-dt * 3);
    camPos.lerp(tmp, kp); camLook.lerp(tmpL, kp);
    shake = Math.max(0, shake - dt * 1.6);
    camera.position.set(camPos.x + (Math.random() - 0.5) * shake * 0.5, camPos.y + (Math.random() - 0.5) * shake * 0.5, camPos.z);
    camera.lookAt(camLook);
    sun.target.position.set(P.x, camY, P.z - 6); sun.position.set(P.x - 8, camY + 34, P.z + 18);
    var tf = mode === 'play' ? 62 + (speed - 16) * 0.6 : 62;
    fov += (tf - fov) * Math.min(1, dt * 3);
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }

  function updateHud() {
    $('rank').textContent = computeRank() + '/' + (rivals.length + 1);
    var m = Math.floor(Math.max(0, -P.z));
    if (m !== shownDist) { shownDist = m; $('dist').textContent = m; $('coins').textContent = coins; $('speed').textContent = Math.round(speed * 3.6); }
    else $('coins').textContent = coins;
  }

  // ---------- loop ----------
  reset();
  camPos.set(0, 2.6, 5); camLook.set(0, 1.1, 0);
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    if (mode === 'play') stepPlay(dt); else if (mode === 'dead') stepDead(dt);
    if (mode !== 'ready') rivals.forEach(function (r) { stepRival(r, dt); });
    for (var i = 0; i < segments.length; i++) {
      var cs = segments[i].coins;
      for (var j = 0; j < cs.length; j++) if (!cs[j].taken) cs[j].mesh.rotation.y = clock * 3;
    }
    animatePlayer(dt); rivals.forEach(function (r) { animateRival(r, dt); }); updateCamera(dt);
    if (mode === 'play') updateHud();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
