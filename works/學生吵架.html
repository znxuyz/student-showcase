<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>海報風波</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: blackboard header band; left column = meters, classroom stage, decision panel; right column = level list and how-to. */
:root{
  --f-disp:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --bg:#eef2ee; --fg:#1b2723; --muted:#55645e; --line:#cbd6cf; --panel:#f8faf8;
  --board:#2d4a41; --chalk:#eef3ec; --chalk-dim:#b9c9bf;
  --accent:#d99b1e; --accent-ink:#2e2100;
  --wall:#dfe8e0; --wall2:#e5e0ee; --floor:#c9b08a; --desk:#b98a54; --desk-top:#d6a96b;
  --win:#a8d3ee; --paper:#fffef9; --skin:#f1c9a5; --hair:#2a211d; --ink:#251d1a;
  --yu:#3d78b8; --qing:#d9708a; --tea:#6a5b8c; --pants:#2b3552;
  --alert:#c2412d; --calm:#2f7a9a; --leaf:#5a9970; --ok:#2f7a4d; --warn:#8f6200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --fg:#e3ebe6; --muted:#9fb0a8; --line:#2c3a35; --panel:#18221f;
    --board:#1f352d; --chalk:#eef3ec; --chalk-dim:#a9bab0;
    --accent:#e5aa35; --accent-ink:#2e2100;
    --wall:#22302b; --wall2:#2a2838; --floor:#4a3d2c; --desk:#6b4d2e; --desk-top:#8a6a42;
    --win:#27465a; --paper:#ece8da; --skin:#e0b793; --hair:#120d0b; --ink:#251d1a;
    --yu:#5b97d6; --qing:#e68aa2; --tea:#8a7bb0; --pants:#46527a;
    --alert:#e8745f; --calm:#58a9c9; --leaf:#4a8760; --ok:#6cc08c; --warn:#e5aa35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --fg:#e3ebe6; --muted:#9fb0a8; --line:#2c3a35; --panel:#18221f;
  --board:#1f352d; --chalk:#eef3ec; --chalk-dim:#a9bab0;
  --accent:#e5aa35; --accent-ink:#2e2100;
  --wall:#22302b; --wall2:#2a2838; --floor:#4a3d2c; --desk:#6b4d2e; --desk-top:#8a6a42;
  --win:#27465a; --paper:#ece8da; --skin:#e0b793; --hair:#120d0b; --ink:#251d1a;
  --yu:#5b97d6; --qing:#e68aa2; --tea:#8a7bb0; --pants:#46527a;
  --alert:#e8745f; --calm:#58a9c9; --leaf:#4a8760; --ok:#6cc08c; --warn:#e5aa35;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.7;padding-block:0 40px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--board);color:var(--chalk);border-bottom:8px solid var(--desk-top)}
.top .wrap{padding-block:26px 22px}
.kicker{margin:0 0 6px;font-size:13px;letter-spacing:.14em;color:var(--chalk-dim)}
h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1.15;text-wrap:balance}
.lede{margin:10px 0 0;max-width:36em;color:var(--chalk-dim)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;padding-block:24px 0;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tools button{padding:4px 12px;font-size:14px}
.tools button[aria-pressed="true"]{border-color:var(--calm);box-shadow:inset 0 0 0 1px var(--calm)}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.meter{min-width:0}
.mh{display:flex;gap:8px;align-items:baseline;font-size:14px;margin-bottom:4px}
.mh span{font-weight:700}
.mh em{font-style:normal;color:var(--muted);font-size:13px}
.mh b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px}
.dl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:right}
.dl.up{color:var(--ok)}
.dl.down{color:var(--alert)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px;color:var(--muted)}
.stage-head b{color:var(--fg);font-size:15px}
figure{margin:0}
#stage{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--wall)}
#stage text{font-family:var(--f-disp)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:13em}
.rl{margin:0;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.prompt{margin:0;font-family:var(--f-disp);font-size:21px;line-height:1.55;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button:hover{border-color:var(--board)}
button:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;font-family:var(--f-disp);font-size:18px;line-height:1.5}
.choice .k{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px var(--f-ui);color:var(--muted)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;align-self:flex-start;padding:10px 22px}
.primary:hover{border-color:var(--accent-ink)}
.casebtn{margin:0}
.casebtn b{font-size:19px}
.casebtn small{display:block;font-family:var(--f-ui);font-size:14px;color:var(--muted);line-height:1.5;margin-top:2px}
.casebtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.casebtn[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;padding:1px 12px;border-radius:999px;border:2px solid currentColor;font-size:14px;font-weight:700}
.pill.best{color:var(--ok)}
.pill.mid{color:var(--warn)}
.pill.bad{color:var(--alert)}
.chosen{margin:0;font-family:var(--f-disp);font-size:17px;color:var(--muted)}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:5em minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.line:last-child{border-bottom:0}
.who{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--muted)}
.who::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.line[data-who="小晴"] .who::before{background:var(--qing)}
.line[data-who="小宇"] .who::before{background:var(--yu)}
.line[data-who="王老師"] .who::before{background:var(--tea)}
.line[data-who="同學"] .who::before{background:var(--calm)}
.say{font-family:var(--f-disp);font-size:18px;line-height:1.6}
.line.n .say{font-size:16px;color:var(--muted)}
.why{margin:0;font-size:15px}
.stars{display:flex;gap:6px}
.rt{margin:0;font-family:var(--f-disp);font-size:28px;line-height:1.3}
.avg{margin:0;color:var(--muted);font-size:15px}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.review li{border-top:1px dashed var(--line);padding-top:10px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.review .t{font-family:var(--f-disp);font-size:17px}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.side h2{margin:0 0 10px;font-family:var(--f-disp);font-size:22px}
.lv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lv li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;padding:8px 12px;border-radius:8px;border:1px solid transparent}
.lv .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lv li[data-s="done"] .n{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.lv li[data-s="now"]{background:var(--panel);border-color:var(--line)}
.lv li[data-s="now"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv li[data-s="todo"]{opacity:.7}
.howto{background:var(--board);color:var(--chalk);border-radius:10px;padding:16px 18px;border-bottom:6px solid var(--desk-top)}
.howto h2{color:var(--chalk)}
.howto ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--chalk)}
.note{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .hud{grid-template-columns:minmax(0,1fr);gap:8px}
  .line{grid-template-columns:minmax(0,1fr);gap:2px}
}
/* ---- character animation ---- */
#stage .ppl{transform-origin:0 0}
#stage .head{transform-origin:0 -100px}
#stage .eyes{transform-origin:0 -122px;animation:blink 4.6s infinite;animation-delay:var(--d,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.024)}}
@keyframes shakeA{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@keyframes startle{0%{transform:translateY(0)}6%{transform:translateY(-16px)}14%{transform:translateY(0)}20%{transform:translateY(-5px)}27%,100%{transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-7px) scale(.98,1.03)}}
@keyframes droop{0%,100%{transform:rotate(5deg)}50%{transform:rotate(10deg)}}
@keyframes jolt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes nod{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes jab{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes gest{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes tear{0%{transform:translateY(0);opacity:1}80%{opacity:.8}100%{transform:translateY(18px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes walkin{
  0%{transform:translate(var(--dx),0);opacity:0}
  10%{opacity:1}
  20%{transform:translate(calc(var(--dx)*.8),-7px)}
  40%{transform:translate(calc(var(--dx)*.6),0)}
  60%{transform:translate(calc(var(--dx)*.4),-7px)}
  80%{transform:translate(calc(var(--dx)*.2),0)}
  100%{transform:translate(0,0);opacity:1}}
#stage .m-neutral,#stage .m-calm{animation:breathe 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
#stage .m-angry{animation:shakeA .26s ease-in-out infinite;animation-delay:var(--d,0s)}
#stage .m-sad{animation:sway 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
#stage .m-sorry{animation:sway 1.9s ease-in-out infinite;animation-delay:var(--d,0s)}
#stage .m-shock{animation:startle 2.6s ease-out infinite;animation-delay:var(--d,0s)}
#stage .m-smile{animation:hop 1.1s ease-in-out infinite;animation-delay:var(--d,0s)}
#stage .m-sad .head{animation:droop 3.4s ease-in-out infinite}
#stage .m-angry .head{animation:jolt .26s ease-in-out infinite}
#stage .talk .head{animation:nod .55s ease-in-out infinite}
#stage .arm.up{animation:wave .7s ease-in-out infinite}
#stage .arm.up.r{animation-delay:-.3s}
#stage .m-angry .arm.up{animation:jab .38s ease-in-out infinite}
#stage .talk .arm{animation:gest .8s ease-in-out infinite}
#stage .talk .arm.r{animation-delay:-.4s}
#stage .talk .arm.up{animation:wave .6s ease-in-out infinite}
#stage .tear,#stage .sweat{animation:tear 1.8s ease-in infinite}
#stage .ang{animation:pulse .5s ease-in-out infinite;transform-origin:0 0}
#stage .bub{animation:pop .35s cubic-bezier(.3,1.6,.5,1) .12s both}
#stage.enter-on .enter{animation:walkin .9s ease-out both}
#stage.enter-on .bub{animation-delay:.95s}
.stars svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars svg:nth-child(2){animation-delay:.15s}
.stars svg:nth-child(3){animation-delay:.3s}
#stage .tmouth{opacity:0;transform-origin:0 -109px}
#stage .speaking .tmouth{opacity:1;animation:talkm .24s ease-in-out infinite}
#stage .speaking .smouth{opacity:0}
@keyframes talkm{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.after{display:flex;flex-direction:column;gap:12px}
.lines.playing .line:not(.now) .say{opacity:.6}
.line.now .who{color:var(--fg)}
.skip{align-self:flex-start;padding:4px 14px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}#stage *,.stars svg{animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <p class="kicker" id="kick">導師模擬遊戲　案例一　第三節下課</p>
    <h1 id="h1t">海報風波</h1>
    <p class="lede" id="lede">你是導師王老師。小晴和小宇吵起來了，每一關選一個做法，看看兩位同學和全班的反應。</p>
  </div>
</header>

<main class="wrap layout">
  <section class="col" aria-label="遊戲">
    <div class="tools" role="group" aria-label="聲音設定"><button type="button" id="sndBtn" aria-pressed="true">音效：開</button><button type="button" id="voiceBtn" aria-pressed="false">朗讀台詞：關</button></div>
    <div class="hud" id="hud">
      <div class="meter"><div class="mh"><span>小晴的心情</span><em id="mq"></em><b id="vq"></b><i class="dl" id="dq"></i></div><div class="bar"><i id="bq" style="background:var(--qing)"></i></div></div>
      <div class="meter"><div class="mh"><span>小宇的心情</span><em id="my"></em><b id="vy"></b><i class="dl" id="dy"></i></div><div class="bar"><i id="by" style="background:var(--yu)"></i></div></div>
      <div class="meter"><div class="mh"><span>班級氣氛</span><em id="mc"></em><b id="vc"></b><i class="dl" id="dc"></i></div><div class="bar"><i id="bc" style="background:var(--calm)"></i></div></div>
    </div>
    <div class="stage-head"><span>地點：<b id="place">教室</b></span><span id="count"></span></div>
    <figure><svg id="stage" viewBox="0 0 800 420" role="img" aria-label=""></svg></figure>
    <div class="panel" id="panel" aria-live="polite"></div>
  </section>

  <aside class="side">
    <section aria-labelledby="lvh">
      <h2 id="lvh">關卡</h2>
      <ol class="lv" id="lv"></ol>
    </section>
    <section class="howto" aria-labelledby="hw">
      <h2 id="hw">怎麼玩</h2>
      <ul>
        <li>每一關有三個做法，選你覺得最好的一個。</li>
        <li>選項順序每次都會打亂，也可以按鍵盤 1、2、3 選擇。</li>
        <li>玩完六關，依三個數值的平均給你星等。</li>
      </ul>
    </section>
    <p class="note">人物與事件皆為虛構，用來練習班級衝突的處理方式。</p>
  </aside>
</main>

<script>
(function(){
  var stage=document.getElementById('stage');
  function $(id){return document.getElementById(id);}

  /* ---------- drawing helpers ---------- */
  function bubble(cx,y,text){
    var w=text.length*16+26; var x=Math.max(8,Math.min(792-w,cx-w/2)); var tx=Math.max(x+14,Math.min(x+w-14,cx));
    return '<g class="bub" style="transform-origin:'+tx+'px '+(y+44)+'px"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="34" rx="12" style="fill:var(--panel);stroke:var(--line)" stroke-width="1.5"/>'+
      '<path d="M'+(tx-7)+' '+(y+33)+' L'+tx+' '+(y+44)+' L'+(tx+7)+' '+(y+33)+'Z" style="fill:var(--panel);stroke:var(--line)" stroke-width="1.5"/>'+
      '<rect x="'+(tx-9)+'" y="'+(y+30)+'" width="18" height="5" style="fill:var(--panel)"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+23)+'" text-anchor="middle" font-size="15.5" style="fill:var(--fg)">'+text+'</text></g>';
  }
  function bb(cx,y,t){return t?bubble(cx,y,t):'';}
  function anger(x,y){
    return '<g transform="translate('+x+' '+y+')"><g class="ang" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--alert)"><path d="M-9 -4 Q-3 -4 -3 -10 M9 -4 Q3 -4 3 -10 M-9 4 Q-3 4 -3 10 M9 4 Q3 4 3 10"/></g></g>';
  }
  function person(o){
    var x=o.x,y=(o.y==null?385:o.y),s=(o.s==null?1.2:o.s),shirt=o.shirt||'--yu',mood=o.mood||'neutral',look=o.look||0,
        arms=o.arms||[[-30,-56],[30,-56]],hair=o.hair||'short',tilt=o.tilt||0,ex=look*3;
    function limb(sx,h){return '<g class="arm'+(h[1]<-85?' up':'')+(sx>0?' r':'')+'" style="transform-origin:'+sx+'px -92px"><line x1="'+sx+'" y1="-92" x2="'+h[0]+'" y2="'+h[1]+'" stroke-width="11" stroke-linecap="round" style="stroke:var('+shirt+')"/><circle cx="'+h[0]+'" cy="'+h[1]+'" r="5.5" style="fill:var(--skin)"/></g>';}
    var lower=o.skirt
      ?'<rect x="-12" y="-18" width="8" height="18" style="fill:var(--skin)"/><rect x="4" y="-18" width="8" height="18" style="fill:var(--skin)"/><path d="M-19 -46 L19 -46 L26 -16 L-26 -16Z" style="fill:var(--pants)"/>'
      :'<rect x="-15" y="-46" width="12" height="46" rx="3" style="fill:var(--pants)"/><rect x="3" y="-46" width="12" height="46" rx="3" style="fill:var(--pants)"/>';
    var shoes='<ellipse cx="-9" cy="1" rx="10" ry="4" style="fill:var(--ink)"/><ellipse cx="9" cy="1" rx="10" ry="4" style="fill:var(--ink)"/>';
    var eyeR=(mood==='shock')?4:2.8, browsD='', mouth='', extra='';
    switch(mood){
      case 'angry': browsD='M-16 -133 L-4 -127 M16 -133 L4 -127'; mouth='<path d="M-8 -107 Q0 -115 8 -107" fill="none"/>';
        extra='<circle cx="-14" cy="-112" r="5" style="fill:var(--alert)" opacity=".35"/><circle cx="14" cy="-112" r="5" style="fill:var(--alert)" opacity=".35"/>'; break;
      case 'sad': browsD='M-16 -127 L-4 -132 M16 -127 L4 -132'; mouth='<path d="M-6 -107 Q0 -112 6 -107" fill="none"/>';
        extra='<ellipse class="tear" cx="'+(-12+ex)+'" cy="-113" rx="2.4" ry="4" style="fill:var(--win)"/>'; break;
      case 'sorry': browsD='M-16 -127 L-4 -132 M16 -127 L4 -132'; mouth='<path d="M-6 -109 Q-3 -112 0 -109 Q3 -106 6 -109" fill="none"/>';
        extra='<path class="sweat" d="M24 -138 q-4 6 0 9 q4 -3 0 -9z" style="fill:var(--win)"/>'; break;
      case 'shock': browsD='M-15 -135 L-5 -135 M15 -135 L5 -135'; mouth='<ellipse cx="0" cy="-108" rx="4" ry="5" style="fill:var(--ink)" stroke="none"/>'; break;

    $('voiceBtn').addEventListener('click',function(){
      snd.voice=!snd.voice;saveSnd();syncTools();
      if(snd.voice)speakPhase();else{try{speechSynthesis.cancel();}catch(e){}}
    });
  }

  /* ---------- state ---------- */
  var state;
  function newGame(){state={phase:'intro',r:0,q:25,y:30,c:45,d:[0,0,0],order:[],last:null,picks:[]};}
  var caseIdx=0,lastKey='';
  function getBest(id){try{var o=JSON.parse(localStorage.getItem('hpq-best')||'{}');return o[id]||0;}catch(e){return 0;}}
  function setBest(id,n){try{var o=JSON.parse(localStorage.getItem('hpq-best')||'{}');o[id]=n;localStorage.setItem('hpq-best',JSON.stringify(o));}catch(e){}}
  function setCase(i){
    caseIdx=i;CASE=CASES[i];rounds=CASE.rounds;
    $('kick').textContent=CASE.kicker;$('h1t').textContent=CASE.name;$('lede').textContent=CASE.lede;
  }
  function clamp(v){return Math.max(0,Math.min(100,v));}
  function moodOf(v,w){return v>=75?'smile':v>=55?'calm':v>=35?(w==='q'?'sad':'sorry'):'angry';}
  function moodWord(v){return v>=75?'開心':v>=55?'平靜':v>=35?'不安':'生氣';}
  function atmWord(v){return v>=75?'融洽':v>=55?'平穩':v>=35?'緊繃':'緊張';}
  function shuffle(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}

  /* ---------- render ---------- */
  function drawStage(){
    var c={mq:moodOf(state.q,'q'),my:moodOf(state.y,'y'),tm:'calm',tarms:null,bubs:{},last:state.last};
    var html,alt,place;
    if(state.phase==='intro'){html=sceneIntro();place='教室';alt='下課時，小晴和小宇在教室裡面對面大聲爭吵，同學圍在旁邊看。';}
    else if(state.phase==='end'){
      c.tm=(state.q+state.y+state.c)/3>=60?'smile':'calm';
      html=sceneNext('11/10 (二)','早自習')(c);place='教室';alt='隔天早上的教室，小晴、小宇和老師站在補好的海報前。';
    } else {
      var rd=rounds[state.r];
      if(state.phase==='result'&&state.last){var p=state.last;c.tm=p.tm||'calm';c.tarms=p.tarms||null;c.bubs={t:p.say,q:p.bq,y:p.by};}
      html=rd.draw(c);place=rd.place;alt='第 '+(state.r+1)+' 關「'+rd.label+'」的場景。';
    }
    stage.innerHTML=html;stage.setAttribute('aria-label',alt);
    var key=state.phase==='intro'?'i'+caseIdx:(state.phase==='end'?'e'+caseIdx:caseIdx+':'+state.r);
    stage.setAttribute('class',key!==lastKey?'enter-on':'');lastKey=key;$('place').textContent=place;
  }
  function drawHud(){
    var vals={q:state.q,y:state.y,c:state.c},words={q:moodWord(state.q),y:moodWord(state.y),c:atmWord(state.c)};
    ['q','y','c'].forEach(function(k,i){
      $('v'+k).textContent=vals[k];$('m'+k).textContent=words[k];$('b'+k).style.width=vals[k]+'%';
      var d=(state.phase==='result')?state.d[i]:0,el=$('d'+k);
      el.textContent=d>0?'+'+d:(d<0?'−'+Math.abs(d):'');el.className='dl'+(d>0?' up':(d<0?' down':''));
    });
    var cnt=$('count');
    cnt.textContent=(state.phase==='intro')?'':(state.phase==='end'?'結果':'第 '+(state.r+1)+' 關 / '+rounds.length+'　'+rounds[state.r].label);
  }
  function drawLevels(){
    $('lv').innerHTML=rounds.map(function(rd,i){
      var s=(state.phase==='intro')?'todo':(state.phase==='end')?'done':(i<state.r?'done':(i===state.r?'now':'todo'));
      return '<li data-s="'+s+'"><span class="n">'+(s==='done'?'✓':(i+1))+'</span><span>'+rd.label+'</span></li>';
    }).join('');
  }
  function linesHtml(arr,hide){
    return '<div class="lines">'+arr.map(function(l){return '<p class="line '+(l.k||'')+'" data-who="'+l.w+'"'+(hide?' data-hide hidden':'')+' style="margin:0"><span class="who">'+l.w+'</span><span class="say">'+l.t+'</span></p>';}).join('')+'</div>';
  }
  function star(on){
    return '<svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z" stroke-width="1.6" stroke-linejoin="round" style="fill:'+(on?'var(--accent)':'none')+';stroke:'+(on?'var(--accent)':'var(--muted)')+'"/></svg>';
  }
  function casesHtml(){
    return '<div class="choices">'+CASES.map(function(c,i){
      var b=getBest(c.id);
      return '<button type="button" class="choice casebtn" data-case="'+i+'" aria-pressed="'+(i===caseIdx)+'"><span class="k">'+(i+1)+'</span><span><b>'+c.name+'</b><small>'+c.blurb+(b>0?'　最佳紀錄：'+b+' 顆星':'')+'</small></span></button>';
    }).join('')+'</div>';
  }
  function drawPanel(){
    var p=$('panel'),h='',rd=rounds[state.r];
    if(state.phase==='intro'){
      h='<p class="rl">選擇案例</p>'+casesHtml()+'<p class="prompt">'+CASE.introText+'</p>'+
        '<p class="why">一共六關。每一關選一個做法，上方三個數值會跟著變動。目標是讓兩位同學都冷靜下來，也讓班上維持好的氣氛。</p>'+
        '<button type="button" class="primary" id="startBtn">開始遊戲</button>';
    } else if(state.phase==='choose'){
      h='<p class="rl">第 '+(state.r+1)+' 關 / '+rounds.length+'　'+rd.label+'</p><p class="prompt">'+rd.prompt+'</p><div class="choices">'+
        state.order.map(function(ci,pos){return '<button type="button" class="choice" data-i="'+ci+'"><span class="k">'+(pos+1)+'</span><span>'+rd.choices[ci].text+'</span></button>';}).join('')+'</div>';
    } else if(state.phase==='result'){
      var c=state.last,vd=VERDICT[c.v],lastR=(state.r===rounds.length-1);
      h='<p class="rl">第 '+(state.r+1)+' 關 / '+rounds.length+'　'+rd.label+'</p>'+linesHtml([{w:'王老師',t:c.text}].concat(c.react),true)+
        '<button type="button" class="skip" id="skipBtn">略過對話</button>'+
        '<div class="after" hidden><p style="margin:0"><span class="pill '+vd[0]+'">'+vd[1]+'</span></p><p class="why" style="margin:0"><b>為什麼：</b>'+c.why+'</p>'+
        '<button type="button" class="primary" id="nextBtn">'+(lastR?'看結果':'下一關')+'</button></div>';
    } else {
      var avg=Math.round((state.q+state.y+state.c)/3),n=avg>=80?3:avg>=60?2:avg>=40?1:0;
      var prevBest=getBest(CASE.id); if(n>prevBest)setBest(CASE.id,n);
      var title=['再試一次','新手導師','有潛力的導師','班上的定心丸'][n];
      var sum=['三個數值還有很大的空間，從頭來過看看不同做法。','事情有處理，但有幾個地方讓同學不太舒服。','大方向正確，有些細節可以更好。','兩位同學和全班都被你照顧到了。'][n];
      h='<p class="rl">結果</p><div class="stars" role="img" aria-label="'+n+' 顆星，滿分 3 顆">'+star(n>=1)+star(n>=2)+star(n>=3)+'</div>'+
        '<p class="rt">'+title+'</p><p class="avg">平均 '+avg+' 分（小晴 '+state.q+'、小宇 '+state.y+'、班級 '+state.c+'）。'+sum+(Math.max(prevBest,n)>0?'　本案例最佳：'+Math.max(prevBest,n)+' 顆星。':'')+'</p>'+
        '<ul class="review">'+state.picks.map(function(pk){
          var r=rounds[pk.r],c=r.choices[pk.i],vd=VERDICT[c.v],best=null;
          r.choices.forEach(function(x){if(x.v==='best')best=x;});
          return '<li><span><span class="pill '+vd[0]+'">'+vd[1]+'</span>　第 '+(pk.r+1)+' 關　'+r.label+'</span><span class="t">'+c.text+'</span>'+
            (c.v==='best'?'<span class="why">'+c.why+'</span>':'<span class="why">'+c.why+'　比較好的做法：'+best.text+'</span>')+'</li>';
        }).join('')+'</ul><button type="button" class="primary" id="againBtn">再玩一次或換案例</button>';
    }
    p.innerHTML=h;
  }
  function render(){drawStage();drawHud();drawLevels();drawPanel();speakPhase();}

  /* ---------- actions ---------- */
  function begin(){state.phase='choose';state.r=0;state.order=shuffle(rounds[0].choices.length);play('bell');render();}
  function pick(i){
    var c=rounds[state.r].choices[i];
    state.q=clamp(state.q+c.fx[0]);state.y=clamp(state.y+c.fx[1]);state.c=clamp(state.c+c.fx[2]);
    state.d=c.fx.slice();state.picks.push({r:state.r,i:i});state.last=c;state.phase='result';render();
    play('tick');
  }
  function advance(){
    state.last=null;state.d=[0,0,0];
    if(state.r>=rounds.length-1){state.phase='end';} else {state.r++;state.phase='choose';state.order=shuffle(rounds[state.r].choices.length);}
    render();
    if(state.phase==='end')play('end',starsNow());else play('steps');
    try{ if(window.innerWidth<=860){ var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; $('hud').scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'}); } }catch(e){}
  }
  $('panel').addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t)return;
    if(t.id==='skipBtn'){stopTalk();finishLines();}
    else if(t.id==='startBtn')begin();
    else if(t.id==='nextBtn')advance();
    else if(t.id==='againBtn'){play('tick');newGame();render();}
    else if(t.classList.contains('casebtn')){play('tick');setCase(parseInt(t.getAttribute('data-case'),10));render();}
    else if(t.classList.contains('choice'))pick(parseInt(t.getAttribute('data-i'),10));
  });
  document.addEventListener('keydown',function(e){
    if(state.phase!=='choose')return;
    var n=parseInt(e.key,10); if(n>=1&&n<=state.order.length)pick(state.order[n-1]);
  });
  initTools();setCase(0);newGame();render();
})();
</script>

</body></html>
