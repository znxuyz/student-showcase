<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>夜市射氣球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen night-market stall. HUD on top, canvas play field fills the rest, overlays for start / result with a leaderboard. */
:root {
  --bg: #0d1a1d;
  --bg-2: #14292d;
  --fg: #fff3dc;
  --muted: #9fb7b5;
  --lamp: #ffb84a;
  --hit: #ff5a4a;
  --ice: #7fd6ff;
  --line: #28474b;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; max-width: 980px; margin: 0 auto; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.hud .cell { min-width: 0; }
.label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.num { font-family: var(--font-display); font-weight: 900; font-size: clamp(30px, 8vw, 48px); line-height: 1; font-variant-numeric: tabular-nums; }
.hud .score .num { color: var(--lamp); }
.hud .time { text-align: center; }
.hud .best { text-align: right; }
.hud .best .num { font-size: clamp(20px, 5vw, 28px); color: var(--fg); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: var(--lamp); transform-origin: left center; }
.bar.low > i { background: var(--hit); }
.stage {
  position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden;
  background: linear-gradient(180deg, #0a1416 0%, var(--bg-2) 100%);
  border: 1px solid var(--line);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.overlay {
  position: absolute; inset: 0; display: flex; overflow: auto;
  padding: 16px; background: rgba(8, 16, 18, .8); text-align: center;
}
.panel { margin: auto; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.panel h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(36px, 10vw, 56px); line-height: 1.05; text-wrap: balance; }
.panel h1 em { font-style: normal; color: var(--lamp); }
.panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; text-wrap: balance; }
.rules { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.rules span { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.rules b { color: var(--lamp); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.namebox { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 260px; text-align: left; }
.namebox label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.namebox input {
  font: inherit; font-weight: 700; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; -webkit-user-select: text; user-select: text;
}
.namebox input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 1px; }
button {
  font: inherit; font-weight: 900; font-size: 20px; letter-spacing: .08em;
  background: var(--lamp); color: #2a1900; border: 0; border-radius: 12px;
  padding: 13px 40px; cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.final { font-family: var(--font-display); font-weight: 900; font-size: clamp(56px, 16vw, 92px); line-height: 1; color: var(--lamp); font-variant-numeric: tabular-nums; }
.stat { font-size: 14px; color: var(--muted); }
.newbest { color: var(--hit); font-weight: 900; letter-spacing: .1em; }
.board { width: 100%; text-align: left; border-top: 1px solid var(--line); padding-top: 10px; }
.board h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.board ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.board li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
.board li .rk { color: var(--muted); font-weight: 700; }
.board li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.board li .sc { font-weight: 900; color: var(--lamp); }
.board li.me { background: rgba(255, 184, 74, .14); }
.board li:nth-child(-n+3) .rk { color: var(--lamp); }
.board .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<div class="app">
  <div class="hud">
    <div class="cell score"><div class="label">得分</div><div class="num" id="score">0</div></div>
    <div class="cell time"><div class="label">剩餘秒數</div><div class="num" id="time">20</div></div>
    <div class="cell best"><div class="label">我的最高分</div><div class="num" id="best">0</div></div>
  </div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="射氣球遊戲畫面"></canvas>
    <div class="overlay" id="startOv">
      <div class="panel">
        <h1>夜市<em>射氣球</em></h1>
        <div class="rules">
          <span>限時 <b>20</b> 秒</span>
          <span><i class="dot" style="background:#e8453c"></i>一般 <b>+2</b></span>
          <span><i class="dot" style="background:#ffc83d"></i>金色 <b>+10</b></span>
          <span><i class="dot" style="background:#7fd6ff"></i>冰凍 <b>+3</b> 秒</span>
          <span><i class="dot" style="background:#2b2f36;border:1px solid #888"></i>炸彈 <b>-6</b></span>
        </div>
        <p>連續射中會累積連擊，每 5 連擊得分加倍（最高 ×3）。射偏會中斷連擊，時間越久氣球越快。</p>
        <div class="namebox">
          <label for="nick">排行榜暱稱</label>
          <input id="nick" type="text" maxlength="12" autocomplete="off" placeholder="輸入你的名字">
        </div>
        <button id="startBtn" type="button">開始射擊</button>
        <div class="board">
          <h2>全球排行榜 TOP 10</h2>
          <ol id="board1"></ol>
          <p class="note" id="note1"></p>
        </div>
      </div>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="panel">
        <div class="label">時間到，總分</div>
        <div class="final" id="finalScore">0</div>
        <div class="newbest" id="newBest" hidden>新紀錄！</div>
        <div class="stat" id="stat"></div>
        <button id="againBtn" type="button">再玩一次</button>
        <div class="board">
          <h2>全球排行榜 TOP 10</h2>
          <ol id="board2"></ol>
          <p class="note" id="note2"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var DURATION = 20;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var elScore = document.getElementById('score'), elTime = document.getElementById('time'), elBest = document.getElementById('best');
  var bar = document.getElementById('bar'), fill = document.getElementById('barfill');
  var startOv = document.getElementById('startOv'), endOv = document.getElementById('endOv');
  var nick = document.getElementById('nick');
  var COLORS = ['#e8453c', '#f6c026', '#2fb3a3', '#f07fa8', '#4a8fe0', '#8bd45a'];
  var W = 0, H = 0, dpr = 1;
  var balloons = [], particles = [], floats = [], rings = [];
  var state = 'idle', score = 0, shots = 0, hits = 0, startT = 0, lastT = 0, spawnAcc = 0, best = 0;
  var bonusSec = 0, combo = 0, maxCombo = 0, lastElapsed = 0;

  try { best = parseInt(localStorage.getItem('balloon-best') || '0', 10) || 0; } catch (e) {}
  elBest.textContent = best;
  try { nick.value = localStorage.getItem('balloon-nick') || ''; } catch (e) {}

  var audio = null;
  function beep(f0, f1, dur, type) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
      o.type = type || 'square'; o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      g.gain.setValueAtTime(0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(t0 + dur);
    } catch (e) {}
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function rand(a, b) { return a + Math.random() * (b - a); }
  function mult() { return Math.min(3, 1 + Math.floor(combo / 5)); }

  // difficulty 0..1 over the 20 seconds
  function diff() { return state === 'play' ? Math.min(1, lastElapsed / DURATION) : 0; }

  function spawn() {
    var d = diff(), scale = Math.min(1, Math.max(0.75, W / 600));
    var roll = Math.random(), kind = 'normal';
    if (state === 'play') {
      if (roll < 0.08) kind = 'gold';
      else if (roll < 0.14) kind = 'ice';
      else if (roll < 0.28) kind = 'bomb';
    }
    var rad = rand(26, 42) * scale, speedK = 1 + d * 0.7;
    if (kind === 'gold') { rad = rand(22, 28) * scale; speedK *= 1.5; }
    var color = kind === 'gold' ? '#ffc83d' : kind === 'ice' ? '#7fd6ff' : kind === 'bomb' ? '#2b2f36' : COLORS[(Math.random() * COLORS.length) | 0];
    var b = {
      kind: kind, x: rand(rad + 8, W - rad - 8), y: H + rad + 10, r: rad,
      vy: rand(70, 150) * Math.max(0.8, H / 520) * speedK,
      sway: rand(8, 26), phase: rand(0, 6.28), freq: rand(1.2, 2.4), color: color, bx: 0
    };
    b.bx = b.x;
    balloons.push(b);
  }

  function burst(b, color) {
    for (var i = 0; i < 16; i++) {
      var a = rand(0, 6.283), s = rand(80, 260);
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.5, t: 0, c: color || b.color, s: rand(2, 4.5) });
    }
  }
  function floatText(x, y, text, color) { floats.push({ x: x, y: y, t: 0, life: 0.9, text: text, color: color }); }

  function shoot(px, py) {
    if (state !== 'play') return;
    shots++;
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i], dx = px - b.x, dy = py - b.y, ry = b.r * 1.18;
      if ((dx * dx) / (b.r * b.r) + (dy * dy) / (ry * ry) <= 1.15) {
        balloons.splice(i, 1); hits++;
        if (b.kind === 'bomb') {
          score = Math.max(0, score - 6); combo = 0;
          burst(b, '#ff5a4a'); floatText(b.x, b.y - b.r, '-6', '#ff5a4a'); beep(180, 40, 0.25, 'sawtooth');
        } else if (b.kind === 'ice') {
          bonusSec += 3; combo++;
          burst(b, '#bfeaff'); floatText(b.x, b.y - b.r, '+3 秒', '#7fd6ff'); beep(700, 1400, 0.18, 'sine');
        } else {
          var base = b.kind === 'gold' ? 10 : 2, gain = base * mult();
          combo++; score += gain;
          burst(b); floatText(b.x, b.y - b.r, '+' + gain, b.kind === 'gold' ? '#ffd966' : '#ffb84a');
          beep(b.kind === 'gold' ? 900 : 520, b.kind === 'gold' ? 300 : 90, 0.1);
        }
        if (combo > maxCombo) maxCombo = combo;
        elScore.textContent = score;
        return;
      }
    }
    combo = 0;
    rings.push({ x: px, y: py, t: 0, life: 0.3 });
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    shoot(e.clientX - r.left, e.clientY - r.top);
  });

  function glyph(b, text, color, size) {
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + size + 'px "Noto Sans TC", sans-serif';
    ctx.fillText(text, b.x, b.y + 1);
  }

  function drawBalloon(b) {
    var rx = b.r, ry = b.r * 1.18;
    ctx.strokeStyle = 'rgba(255,243,220,.35)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y + ry);
    ctx.quadraticCurveTo(b.x + Math.sin(b.phase * 2) * 8, b.y + ry + 16, b.x, b.y + ry + 32); ctx.stroke();
    ctx.fillStyle = b.color; ctx.beginPath();
    ctx.moveTo(b.x, b.y + ry - 1); ctx.lineTo(b.x - 5, b.y + ry + 7); ctx.lineTo(b.x + 5, b.y + ry + 7); ctx.closePath(); ctx.fill();
    if (b.kind === 'gold') {
      ctx.fillStyle = 'rgba(255,200,61,.18)'; ctx.beginPath(); ctx.ellipse(b.x, b.y, rx * 1.5, ry * 1.4, 0, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, rx, ry, 0, 0, 6.283); ctx.fill();
    if (b.kind === 'bomb') { ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(b.x - rx * 0.38, b.y - ry * 0.4, rx * 0.16, ry * 0.3, -0.5, 0, 6.283); ctx.fill();
    if (b.kind === 'gold') glyph(b, '10', '#5a3b00', Math.round(rx * 0.9));
    else if (b.kind === 'ice') glyph(b, '+3秒', '#0b3a52', Math.round(rx * 0.62));
    else if (b.kind === 'bomb') glyph(b, '炸', '#ff5a4a', Math.round(rx * 0.95));
  }

  function drawBulbs(t) {
    var n = Math.max(6, Math.round(W / 70));
    ctx.strokeStyle = 'rgba(255,243,220,.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var x = (W / n) * i, y = 14 + Math.sin(i / n * Math.PI) * 14;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (var j = 0; j <= n; j++) {
      var bx = (W / n) * j, by = 14 + Math.sin(j / n * Math.PI) * 14;
      var tw = 0.7 + 0.3 * Math.sin(t * 2 + j * 1.7);
      ctx.fillStyle = 'rgba(255,184,74,' + (0.55 * tw) + ')';
      ctx.beginPath(); ctx.arc(bx, by + 6, 6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,184,74,' + (0.1 * tw) + ')';
      ctx.beginPath(); ctx.arc(bx, by + 6, 16, 0, 6.283); ctx.fill();
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000 || 0); lastT = now;
    var t = now / 1000;
    if (state === 'play') {
      lastElapsed = (now - startT) / 1000;
      var total = DURATION + bonusSec, left = Math.max(0, total - lastElapsed);
      elTime.textContent = Math.ceil(left);
      fill.style.transform = 'scaleX(' + Math.min(1, left / DURATION) + ')';
      bar.classList.toggle('low', left <= 5);
      var interval = 0.5 - diff() * 0.22;
      spawnAcc += dt;
      while (spawnAcc > interval) { spawnAcc -= interval; spawn(); }
      if (left <= 0) endGame();
    } else if (state === 'idle' && balloons.length < 8 && Math.random() < dt * 1.5) {
      spawn();
    }
    for (var i = balloons.length - 1; i >= 0; i--) {
      var b = balloons[i]; b.y -= b.vy * dt; b.phase += b.freq * dt;
      b.x = b.bx + Math.sin(b.phase) * b.sway;
      if (b.y < -b.r * 2 - 40) balloons.splice(i, 1);
    }
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 520 * dt;
      if (q.t > q.life) particles.splice(p, 1);
    }
    for (var f = floats.length - 1; f >= 0; f--) { floats[f].t += dt; if (floats[f].t > floats[f].life) floats.splice(f, 1); }
    for (var r = rings.length - 1; r >= 0; r--) { rings[r].t += dt; if (rings[r].t > rings[r].life) rings.splice(r, 1); }

    ctx.clearRect(0, 0, W, H);
    drawBulbs(t);
    balloons.forEach(drawBalloon);
    particles.forEach(function (q) {
      ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
      ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
    });
    ctx.globalAlpha = 1;
    rings.forEach(function (g) {
      var k = g.t / g.life;
      ctx.strokeStyle = 'rgba(255,243,220,' + (0.6 * (1 - k)) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, 6 + k * 18, 0, 6.283); ctx.stroke();
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '900 26px "Noto Sans TC", sans-serif';
    floats.forEach(function (g) {
      var k = g.t / g.life;
      ctx.globalAlpha = 1 - k; ctx.fillStyle = g.color;
      ctx.fillText(g.text, g.x, g.y - k * 46);
    });
    ctx.globalAlpha = 1;
    if (state === 'play' && combo >= 2) {
      var m = mult();
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = '900 20px "Noto Sans TC", sans-serif';
      ctx.fillStyle = m > 1 ? '#ffb84a' : '#fff3dc';
      ctx.fillText('連擊 ' + combo + (m > 1 ? '  ×' + m : ''), 14, H - 14);
    }
    requestAnimationFrame(frame);
  }

  function startGame() {
    resize();
    try { localStorage.setItem('balloon-nick', cleanName()); } catch (e) {}
    balloons = []; particles = []; floats = []; rings = [];
    score = 0; shots = 0; hits = 0; spawnAcc = 0; bonusSec = 0; combo = 0; maxCombo = 0; lastElapsed = 0;
    elScore.textContent = '0'; elTime.textContent = DURATION;
    fill.style.transform = 'scaleX(1)'; bar.classList.remove('low');
    startOv.hidden = true; endOv.hidden = true;
    startT = performance.now(); state = 'play';
  }

  function endGame() {
    state = 'over';
    elTime.textContent = '0'; fill.style.transform = 'scaleX(0)';
    var isNew = score > best;
    if (isNew) {
      best = score; elBest.textContent = best;
      try { localStorage.setItem('balloon-best', String(best)); } catch (e) {}
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('newBest').hidden = !isNew;
    var acc = shots ? Math.round(hits / shots * 100) : 0;
    document.getElementById('stat').textContent = '射破 ' + hits + ' 顆，命中率 ' + acc + '%，最高連擊 ' + maxCombo;
    endOv.hidden = false;
    document.getElementById('againBtn').focus();
    submitScore(score);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  // ---------- Global leaderboard (db capability) ----------
  var board = null, uid = null, canWrite = null, rows = [], boardState = 'loading', loadTimer = null;
  var lists = [document.getElementById('board1'), document.getElementById('board2')];
  var notes = [document.getElementById('note1'), document.getElementById('note2')];

  function cleanName() {
    var n = (nick.value || '').replace(/\s+/g, ' ').trim().slice(0, 12);
    return n || '玩家';
  }

  function noteText() {
    if (boardState === 'unavailable') return '排行榜目前連不上，遊戲仍可正常遊玩。';
    if (boardState === 'loading') return '排行榜載入中…';
    if (canWrite === false) return '你目前只能查看排行榜。要上榜，請向分享者索取「可互動」的權限。';
    if (!rows.length) return '還沒有人上榜，成為第一名吧。';
    return '';
  }

  function renderBoard() {
    lists.forEach(function (ol) {
      while (ol.firstChild) ol.removeChild(ol.firstChild);
      rows.forEach(function (r, i) {
        var li = document.createElement('li');
        if (uid && r.id === uid) li.className = 'me';
        var a = document.createElement('span'); a.className = 'rk'; a.textContent = String(i + 1);
        var b = document.createElement('span'); b.className = 'nm'; b.textContent = r.name || '玩家';
        var c = document.createElement('span'); c.className = 'sc'; c.textContent = String(r.score);
        li.appendChild(a); li.appendChild(b); li.appendChild(c);
        ol.appendChild(li);
      });
    });
    notes.forEach(function (n) { n.textContent = noteText(); });
  }

  var writing = false;
  async function submitScore(s) {
    if (!board || !uid || canWrite === false || s <= 0 || writing) return;
    writing = true;
    try {
      var ref = board.doc('scores/' + uid), snap = await ref.get();
      var old = snap.exists ? (snap.data().score || 0) : 0;
      if (s > old) await ref.set({ name: cleanName(), score: s, at: Date.now() });
      else if (snap.exists && snap.data().name !== cleanName()) await ref.update({ name: cleanName() });
    } catch (e) {
      if (e && e.code === 'invalid_argument') canWrite = false;
      renderBoard();
    }
    writing = false;
  }

  async function initBoard() {
    renderBoard();
    try {
      if (!window.claude || !window.claude.use) { boardState = 'unavailable'; renderBoard(); return; }
      var results = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      board = results[0]; var user = results[1];
      if (!board) { boardState = 'unavailable'; renderBoard(); return; }
      if (user) { uid = await user.id(); canWrite = await user.can('data.write'); }
      loadTimer = setTimeout(function () { boardState = 'unavailable'; renderBoard(); }, 10000);
      board.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) { clearTimeout(loadTimer); boardState = 'ready'; }
        rows = snap.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, name: String(v.name || ''), score: Number(v.score) || 0 }; });
        renderBoard();
      }, function () { clearTimeout(loadTimer); boardState = 'unavailable'; renderBoard(); });
    } catch (e) { boardState = 'unavailable'; renderBoard(); }
  }

  resize();
  requestAnimationFrame(function (n) { lastT = n; frame(n); });
  initBoard();
})();
</script>
