.cat .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
.cat .paw{transform-box:fill-box;transform-origin:50% 100%;animation:wave .8s ease-in-out infinite}

 person(60,'#7BB6FF','#5A3B2E',0,1)+person(104,'#FFB86B','#222',.4,0)+person(148,'#B59BFF','#8A4B2B',.8,0)+

 return s;
}
function bubbles(){
 for(var i=0;i<12;i++){var b=document.createElement("span"),z=10+Math.random()*26;b.className="bub";b.style.cssText="left:"+Math.random()*96+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(9+Math.random()*12)+"s;animation-delay:-"+Math.random()*15+"s";document.body.appendChild(b)}
}

 var o='#F2A65A',k='#14323B';

var CHEER=["分組你最強，加油！","早起的你超棒！","吃飽才有力氣，加油！","穩穩的，你可以的！","活動全靠你，加油！","笑一個，繼續衝！","淋雨也要笑笑的！","卡關沒關係，加油！","快調好了，加油！","最後一題，衝啊！"];
function mascot(i){
 var c=TYPES["PGTLBHYQPG".charAt(i)].c,both=i%2===0;
 var eyes=i%3===0?'<path d="M32 56q6-8 12 0M56 56q6-8 12 0" fill="none" stroke="#14323B" stroke-width="3" stroke-linecap="round"/>':'<circle cx="38" cy="56" r="4.5" fill="#14323B"/><circle cx="62" cy="56" r="4.5" fill="#14323B"/><circle cx="39.5" cy="54.5" r="1.5" fill="#fff"/><circle cx="63.5" cy="54.5" r="1.5" fill="#fff"/>';
 var arms='<path class="o" d="M24 74Q9 68 8 48"/><circle cx="8" cy="45" r="5" fill="#fff" stroke="#14323B" stroke-width="2"/>'+(both?'<path class="o" d="M76 74Q91 68 92 48"/><circle cx="92" cy="45" r="5" fill="#fff" stroke="#14323B" stroke-width="2"/>':'<path class="o" d="M76 78Q92 84 94 96"/>');
 return '<svg class="mas" viewBox="0 0 100 110" aria-hidden="true">'+arms+
 '<path class="o" d="M52 26V10l8-5"/><rect x="18" y="26" width="64" height="10" rx="5" fill="#fff" stroke="#14323B" stroke-width="3"/>'+
 '<path d="M22 36h56l-6 60a8 8 0 0 1-8 7H36a8 8 0 0 1-8-7z" fill="'+c+'" stroke="#14323B" stroke-width="3" stroke-linejoin="round"/>'+
 eyes+'<circle cx="29" cy="65" r="5" fill="#FF9FB5" opacity=".75"/><circle cx="71" cy="65" r="5" fill="#FF9FB5" opacity=".75"/>'+
 '<path d="M43 65q7 9 14 0z" fill="#14323B"/>'+
 '<path d="M88 14l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#F2C94C"/><path d="M14 22l1.5 4.5 4.5 1.5-4.5 1.5L14 34l-1.5-4.5L8 28l4.5-1.5z" fill="#F2C94C"/></svg>';
}
var LIM=15000,GREY="#B8C7CC",BAND=10.7;
var $=function(i){return document.getElementById(i)};
var idx,score,miss,busy,tick,t0,lastText="",res=[];
function show(id){["start","quiz","result"].forEach(function(s){$(s).hidden=(s!==id)});window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function addLayer(col){
  var g=$("layers"),n=g.children.length,y=157-(n+1)*BAND;
  var r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("class","layer");r.setAttribute("x","0");r.setAttribute("width","120");
  r.setAttribute("fill",col);r.setAttribute("y",y+BAND);r.setAttribute("height","0");
  g.appendChild(r);
  requestAnimationFrame(function(){requestAnimationFrame(function(){r.setAttribute("y",y);r.setAttribute("height",BAND+.5)})});
}
function start(){
  idx=0;miss=0;busy=false;res=[];score={P:0,G:0,T:0,L:0,B:0,H:0,Y:0,Q:0};
  $("layers").textContent="";$("cup").classList.remove("wob");
  show("quiz");ask();
}
function ask(){
  var d=QS[idx],timed=$("timerOn").checked;
  $("ill").innerHTML=mascot(idx)+'<div class="say">'+CHEER[idx]+'</div>'+catSVG("cat");$("q").textContent=d[1];
  $("cnt").textContent="點單 "+(idx+1)+" / "+QS.length;
  $("tbar").hidden=!timed;$("sec").textContent="";
  var qc=$("qcard");qc.classList.remove("in");void qc.offsetWidth;qc.classList.add("in");
  var box=$("opts");box.textContent="";
  shuffle(d[2]).forEach(function(o){
    var b=document.createElement("button");
    b.className="opt";b.type="button";b.textContent=o[1];
    b.onclick=function(){pick(o[0])};
    box.appendChild(b);
  });
  renderSlots();busy=false;clearInterval(tick);
  if(timed){
    t0=Date.now();$("tfill").style.width="100%";
    tick=setInterval(function(){
      var left=LIM-(Date.now()-t0);
      $("tfill").style.width=Math.max(0,left/LIM*100)+"%";
      $("sec").textContent=Math.ceil(Math.max(0,left)/1000)+" 秒";
      if(left<=0)pick(null);
    },100);
  }
}
function pick(k){
  if(busy)return;busy=true;clearInterval(tick);
  Array.prototype.forEach.call($("opts").children,function(b){b.disabled=true});
  var ct=$("cat");if(k){score[k]++;res[idx]="ok";addLayer(TYPES[k].c);if(ct)ct.classList.add("jump")}else{miss++;res[idx]="x";bigX();if(miss===3)setTimeout(hint,950);addLayer(GREY);$("sec").textContent="時間到!";if(ct)ct.classList.add("zz")}
  renderSlots();setTimeout(function(){idx++;idx<QS.length?ask():finish()},k?550:900);
}
function finish(){
  var ks=["P","G","T","L","B","H","Y","Q"].sort(function(a,b){return score[b]-score[a]});
  var hidden=miss>=4,k=hidden?"W":ks[0],t=TYPES[k],m=TYPES[t.m];
  var rows=hidden?"":ks.slice(0,3).map(function(x){
    var p=Math.round(score[x]/QS.length*100);
    return '<div class="row"><span>'+TYPES[x].n+'</span><span class="track"><i style="width:'+p+'%;background:'+TYPES[x].c+'"></i></span><span>'+p+'%</span></div>';
  }).join("");
  $("card").style.setProperty("--c",t.c);
  $("card").innerHTML='<div class="rcat">'+catSVG()+'</div>'+(hidden?'<span class="badge">隱藏版解鎖!</span>':miss===0?'<span class="badge" style="background:#4FA36A">✓ 全勤徽章</span>':'')+
   '<p class="tag">店員喊:'+(10+Math.floor(Math.random()*89))+' 號,你的飲料好了!<br>你是</p><h1>'+t.n+'</h1><p class="tag">'+t.t+'</p>'+
   '<div class="quote">「'+t.q+'」</div>'+
   '<p>'+t.d+'</p><p><b style="color:var(--ink)">強項:</b>'+t.s+'</p>'+
   '<div class="pair"><b>最合拍:</b>'+m.n+'('+m.t+')</div>'+'<p style="margin:14px 0 4px">'+(miss?'訂單完成 '+(QS.length-miss)+' / '+QS.length+',<b style="color:#E0577E">✗ '+miss+' 張沒完成</b>':'✓ 10 張訂單全部完成!')+'</p><div class="slots">'+slotHTML()+'</div>'+rows;
  lastText="我在「你是班上的哪一杯手搖飲?」測出來是【"+t.n+"】("+t.t+")。專屬金句:「"+t.q+"」你是哪一杯?來測看看:"+location.href.split("#")[0];
  $("toast").textContent="";show("result");
}
function copy(){
  var ok=function(){$("toast").textContent="已複製,貼到班群吧!"},no=function(){$("toast").textContent="無法自動複製,請手動分享上面的結果。"};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastText).then(ok,no)}
    else{var ta=document.createElement("textarea");ta.value=lastText;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);ok()}
  }catch(e){no()}
}
$("shop").innerHTML=shop();$("shop").appendChild($("cup"));bubbles();
$("startBtn").onclick=start;$("againBtn").onclick=start;$("copyBtn").onclick=copy;
</script>
