<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級成果展</title>
<meta name="description" content="Claude 自製作品・班級成果展：不用寫程式，只要說清楚需求，每個人都能做出自己的互動工具！">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=Huninn&family=LXGW+WenKai+TC:wght@400;700&family=DotGothic16&family=Press+Start+2P&family=Chakra+Petch:wght@600;700&family=Barlow+Condensed:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
/* ================= 頁面基本設定 ================= */
:root{
  --page:#f6f2ea; --page-dot:rgba(29,27,24,.07); --ink:#1d1b18; --ink-soft:#5c574f;
  --chip:#ffffff; --chip-ink:#1d1b18; --chip-line:#e2dccf; --chip-on:#1d1b18; --chip-on-ink:#ffffff;
  --bar:rgba(246,242,234,.86); --mark:#ffd84d;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Huninn","Noto Sans TC",sans-serif;
  --kai:"LXGW WenKai TC","Noto Sans TC",serif;
  --serif:"Noto Serif TC","Noto Sans TC",serif;
  --pixel:"DotGothic16","Noto Sans TC",monospace;
  --tech:"Chakra Petch","Noto Sans TC",sans-serif;
  --cond:"Barlow Condensed","Noto Sans TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#131316; --page-dot:rgba(255,255,255,.06); --ink:#eeece6; --ink-soft:#a8a49b;
    --chip:#1f1f24; --chip-ink:#eeece6; --chip-line:#34343c; --chip-on:#eeece6; --chip-on-ink:#131316;
    --bar:rgba(19,19,22,.86); --mark:#8a6d00; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#131316; --page-dot:rgba(255,255,255,.06); --ink:#eeece6; --ink-soft:#a8a49b;
  --chip:#1f1f24; --chip-ink:#eeece6; --chip-line:#34343c; --chip-on:#eeece6; --chip-on-ink:#131316;
  --bar:rgba(19,19,22,.86); --mark:#8a6d00; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.6;
  background:radial-gradient(var(--page-dot) 1.2px,transparent 1.6px) 0 0/22px 22px,var(--page);
  overflow-x:hidden;
}
a{color:inherit}

/* ================= 頂部標題區 ================= */
.hero{position:relative;padding:72px 16px 48px;text-align:center;overflow:hidden}
.hero-inner{position:relative;z-index:1;max-width:880px;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  background:var(--chip);border:1px solid var(--chip-line);font-size:14px;font-weight:700;color:var(--ink-soft)}
.kicker b{color:var(--ink)}
.hero h1{margin:18px 0 0;font-weight:900;font-size:clamp(34px,7vw,68px);line-height:1.15;letter-spacing:.01em;text-wrap:balance}
.hero h1 .mark{background:linear-gradient(transparent 62%,var(--mark) 62% 92%,transparent 92%);padding:0 .08em}
.hero h1 .dot{color:#e8452c}
.hero h1 .nw{white-space:nowrap}
.hero p.sub{margin:18px auto 0;max-width:640px;font-size:clamp(16px,2.4vw,20px);color:var(--ink-soft);font-weight:500;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.stat{padding:8px 16px;border-radius:14px;background:var(--chip);border:1px solid var(--chip-line);font-weight:700;font-size:15px}
.stat strong{font-size:20px;margin-right:2px}
.floaters span{position:absolute;font-size:clamp(28px,4vw,46px);opacity:.9;animation:floaty 5s ease-in-out infinite;user-select:none}
.floaters span:nth-child(1){left:6%;top:18%;animation-delay:0s}
.floaters span:nth-child(2){left:12%;bottom:12%;animation-delay:-1.2s}
.floaters span:nth-child(3){right:7%;top:16%;animation-delay:-2.4s}
.floaters span:nth-child(4){right:13%;bottom:10%;animation-delay:-3.1s}
.floaters span:nth-child(5){left:24%;top:6%;animation-delay:-.7s;font-size:26px}
.floaters span:nth-child(6){right:25%;top:5%;animation-delay:-1.9s;font-size:26px}

/* ================= 分類篩選列 ================= */
.filters{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--chip-line)}
.filters-inner{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters-inner::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 15px var(--sans);padding:8px 16px;border-radius:999px;cursor:pointer;
  background:var(--chip);color:var(--chip-ink);border:1px solid var(--chip-line);transition:transform .15s,background .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip small{opacity:.6;margin-left:4px;font-weight:500}

/* ================= 卡片牆 ================= */
main{max-width:1240px;margin:0 auto;padding:36px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 24px}
.card{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;gap:12px;min-height:310px;padding:24px;
  border-radius:18px;font-family:var(--sans);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;
  animation:enter .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s);
}
.card::before,.card::after{content:"";position:absolute;pointer-events:none;z-index:0}
.card>*{position:relative;z-index:1}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .icon{font-size:42px;line-height:1;display:inline-block;transition:transform .4s}
.card .tag{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.card h3{margin:4px 0 0;font-size:23px;line-height:1.3;font-weight:900}
.card p{margin:0;font-size:15.5px;line-height:1.75;flex:1}
.card .btn{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;
  padding:11px 22px;font:800 16px var(--sans);text-decoration:none;border-radius:999px;
  transition:transform .2s,box-shadow .2s,filter .2s,background .2s,color .2s;
}
.card .btn .arr{transition:transform .2s}
.card .btn:hover .arr{transform:translateX(4px)}
.card .btn:focus-visible{outline:3px solid #2f8fe0;outline-offset:3px}
.card audio{width:100%;height:40px;border-radius:999px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 0}

/* ================= 共用動畫 ================= */
@keyframes enter{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}60%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:translate(-2px,-2px)}20%{transform:translate(-6px,-2px) rotate(-1deg)}40%{transform:translate(2px,-2px) rotate(1deg)}60%{transform:translate(-5px,-2px)}80%{transform:translate(1px,-2px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.9}46%{opacity:.35}50%{opacity:1}53%{opacity:.5}56%{opacity:1}}
@keyframes sway{0%,100%{transform:translateY(-6px) rotate(-.8deg)}50%{transform:translateY(-6px) rotate(.8deg)}}
@keyframes swing{0%,100%{transform:rotate(0)}30%{transform:rotate(18deg)}70%{transform:rotate(-14deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(.92)}100%{transform:scale(1.1)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}30%{transform:scaleY(1)}60%{transform:scaleY(.6)}}
@keyframes shine{from{transform:translateX(-160%) skewX(-20deg)}to{transform:translateX(360%) skewX(-20deg)}}
@keyframes slide{to{background-position:120px 0}}
@keyframes rise{to{background-position:0 -40px}}
@keyframes blink{50%{opacity:0}}
@keyframes zoom{from{transform:translateX(0)}to{transform:translateX(-40px)}}

/* =========================================================
   每張卡片的專屬風格（class 名稱對應下方 WORKS 的 theme）
   ========================================================= */

/* 1 戰鬥陀螺：熱血競技場風 */
.t-beyblade{background:radial-gradient(circle at 88% 8%,rgba(232,69,44,.5),transparent 45%),linear-gradient(160deg,#22242b,#14151a);color:#ececec;font-family:var(--tech);border:2px solid #3a3d46;border-radius:6px}
.t-beyblade::after{right:-55px;bottom:-55px;width:180px;height:180px;border-radius:50%;border:16px dashed rgba(255,165,60,.22);transition:transform 1.2s}
.t-beyblade .tag{background:#e8452c;color:#fff;border-radius:3px}
.t-beyblade h3{color:#fff}
.t-beyblade p{color:#c9cad0}
.t-beyblade .btn{background:linear-gradient(90deg,#e8452c,#ffa53c);color:#fff;border-radius:2px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-inline:28px}
.t-beyblade:hover{transform:translateY(-6px);border-color:#e8452c;box-shadow:0 18px 40px rgba(232,69,44,.35)}
.t-beyblade:hover .icon{animation:spin .5s linear infinite}
.t-beyblade:hover::after{transform:rotate(360deg)}

/* 2 排球：運動熱血風 */
.t-volley{background:linear-gradient(90deg,#e8590c 50%,#1971c2 50%) top/100% 8px no-repeat,repeating-linear-gradient(90deg,transparent 0 13px,rgba(255,255,255,.05) 13px 14px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.05) 13px 14px),#222831;color:#eee;border-radius:20px}
.t-volley::after{content:"VS";right:14px;bottom:4px;font:italic 700 84px/1 var(--cond);color:rgba(255,255,255,.07)}
.t-volley .tag{background:#ffd43b;color:#222}
.t-volley h3{color:#fff}
.t-volley h3::first-letter{color:#ff8a3d}
.t-volley p{color:#ced4da}
.t-volley .btn{background:#ffd43b;color:#222;box-shadow:0 4px 0 #c79a00}
.t-volley .btn:hover{transform:translateY(2px);box-shadow:0 2px 0 #c79a00}
.t-volley:hover{transform:translateY(-8px);box-shadow:-8px 14px 30px rgba(232,89,12,.3),8px 14px 30px rgba(25,113,194,.3)}
.t-volley:hover .icon{animation:bounce .7s ease infinite}

/* 3 街頭對打：復古街機風 */
.t-street{background:#0e141b;color:#e8eef5;border:4px solid #ffd23f;border-radius:8px;box-shadow:6px 6px 0 #ff6b70}
.t-street::before{inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.t-street::after{content:"INSERT COIN";right:16px;bottom:18px;font:9px "Press Start 2P",monospace;color:#ffd23f;opacity:.5}
.t-street .tag{background:transparent;border:2px solid #5aa6f0;color:#5aa6f0;border-radius:0}
.t-street h3{color:#ffd23f;text-shadow:3px 3px 0 #ff6b70}
.t-street p{color:#b9c4d1}
.t-street .btn{background:#ff6b70;color:#fff;box-shadow:0 5px 0 #a8343a,0 0 0 3px #0e141b,0 0 0 5px #ffd23f}
.t-street .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8343a,0 0 0 3px #0e141b,0 0 0 5px #ffd23f}
.t-street:hover{animation:shake .35s;transform:translate(-2px,-2px);box-shadow:10px 10px 0 #5aa6f0}
.t-street:hover::after{opacity:1;animation:blink .8s steps(1) infinite}

/* 4 哥吉拉：怪獸特攝電影風 */
.t-godzilla{background:linear-gradient(transparent 55%,rgba(255,74,160,.18)),#10151c;color:#e8eef5;border:1px solid #25303d;border-radius:14px;padding-bottom:62px}
.t-godzilla::after{left:0;right:0;bottom:0;height:56px;background:#1c2530;clip-path:polygon(0 100%,0 55%,8% 55%,8% 30%,15% 30%,15% 60%,22% 60%,22% 15%,28% 15%,28% 45%,36% 45%,36% 25%,44% 25%,44% 65%,52% 65%,52% 5%,57% 5%,57% 40%,66% 40%,66% 20%,74% 20%,74% 55%,82% 55%,82% 30%,90% 30%,90% 50%,100% 50%,100% 100%)}
.t-godzilla .tag{background:rgba(255,74,160,.14);color:#ff7dbb;border:1px solid #ff4aa0}
.t-godzilla h3{color:#7af4ff;text-shadow:0 0 14px rgba(122,244,255,.6)}
.t-godzilla p{color:#b8c3cf}
.t-godzilla .btn{background:transparent;color:#7af4ff;border:2px solid #7af4ff}
.t-godzilla .btn:hover{background:#7af4ff;color:#10151c;box-shadow:0 0 22px rgba(122,244,255,.7)}
.t-godzilla:hover{transform:translateY(-6px);box-shadow:0 0 0 1px #ff4aa0,0 0 34px rgba(255,74,160,.45)}
.t-godzilla:hover h3{animation:flicker 1.4s infinite}
.t-godzilla:hover .icon{animation:wobble .5s ease infinite}

/* 5 小狗快跑：可愛童趣風 */
.t-dog{background:radial-gradient(2px 2px at 18% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 18%,#fff,transparent),radial-gradient(2px 2px at 86% 52%,#d6fff8,transparent),radial-gradient(1.5px 1.5px at 42% 76%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 40%,#fff,transparent),linear-gradient(180deg,#121a3a,#263f5c);color:#e8edf6;font-family:var(--round);border-radius:28px;border:3px solid #4fd1c5}
.t-dog::after{content:"🐾";right:16px;bottom:12px;font-size:58px;opacity:.18;transform:rotate(-20deg);transition:transform .5s}
.t-dog .tag{background:#4fd1c5;color:#0a1d1b}
.t-dog h3{color:#fff;font-weight:400}
.t-dog p{color:#c8d1e2}
.t-dog .btn{background:#4fd1c5;color:#0a1d1b;font-family:var(--round);font-weight:400;box-shadow:0 4px 0 #2a8f86}
.t-dog .btn:hover{transform:translateY(2px);box-shadow:0 2px 0 #2a8f86}
.t-dog:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 16px 34px rgba(79,209,197,.3)}
.t-dog:hover .icon{animation:bounce .55s ease infinite}
.t-dog:hover::after{transform:rotate(10deg) scale(1.15)}

/* 6 偷一顆蛋：像素沙漠冒險風 */
.t-egg{background:radial-gradient(circle at 85% 18%,#fff6df 0 30px,transparent 31px),radial-gradient(ellipse 70% 40% at 20% 110%,#f2c08f 0 98%,transparent 100%),linear-gradient(180deg,#ffd23f,#ff7a1a);color:#231c0a;border-radius:0;box-shadow:0 0 0 4px #3b2a14,8px 8px 0 4px #3b2a14;margin:4px 8px 8px 4px;transition:transform .3s steps(3),box-shadow .3s steps(3)}
.t-egg .tag{background:#231c0a;color:#ffd23f;border-radius:0}
.t-egg h3{font-family:var(--pixel);font-weight:400;font-size:25px}
.t-egg p{color:#3b2a14;font-weight:500}
.t-egg .btn{background:#d9341f;color:#fff6df;border-radius:0;box-shadow:4px 4px 0 #3b2a14}
.t-egg .btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #3b2a14}
.t-egg:hover{transform:translate(-4px,-4px);box-shadow:0 0 0 4px #3b2a14,12px 12px 0 4px #3b2a14}
.t-egg:hover .icon{animation:wobble .3s ease-in-out infinite}

/* 7 夜市射氣球：台灣夜市燈籠風 */
.t-night{background:radial-gradient(ellipse at 50% 0%,rgba(255,184,74,.28),transparent 62%),#0d1a1d;color:#fff3dc;border-radius:16px;border:1px solid #28474b;padding-top:40px}
.t-night::before{top:0;left:0;right:0;height:28px;background:radial-gradient(circle at 12px 16px,#ff5a4a 0 7px,transparent 8px) 0 0/48px 28px repeat-x,radial-gradient(circle at 36px 16px,#ffc83d 0 7px,transparent 8px) 0 0/48px 28px repeat-x,linear-gradient(#9fb7b5,#9fb7b5) 0 8px/100% 1px no-repeat;filter:drop-shadow(0 0 6px rgba(255,200,61,.7))}
.t-night .tag{background:#ff5a4a;color:#fff}
.t-night h3{color:#ffc83d;font-family:var(--serif);text-shadow:0 0 16px rgba(255,200,61,.5)}
.t-night p{color:#e3d6bf}
.t-night .btn{background:#ff5a4a;color:#fff}
.t-night .btn:hover{box-shadow:0 0 22px rgba(255,90,74,.75)}
.t-night:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(255,184,74,.25)}
.t-night:hover::before{animation:flicker 1.2s infinite}
.t-night:hover .icon{animation:floaty 1.2s ease-in-out infinite}

/* 8 台北車站：捷運站牌戰術風 */
.t-taipei{background:#fff;color:#0d1117;border-radius:12px;border:1px solid #d5dbe2;padding-top:36px;box-shadow:0 6px 18px rgba(13,17,23,.08)}
.t-taipei::before{top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,#e3002c 0 46%,#ffd24d 46% 48%,#e3002c 48% 96%,#ffd24d 96% 98%,#e3002c 98%) 0 0/120px 100% repeat-x}
.t-taipei::after{content:"R10";right:18px;bottom:20px;width:50px;height:50px;border-radius:50%;background:#e3002c;color:#fff;font:900 16px/50px var(--sans);text-align:center;box-shadow:0 0 0 4px #fff,0 0 0 6px #e3002c}
.t-taipei .tag{background:#0a7ad6;color:#fff;border-radius:4px}
.t-taipei p{color:#3b4652}
.t-taipei .btn{background:#e3002c;color:#fff;border-radius:6px}
.t-taipei .btn:hover{background:#b80024}
.t-taipei:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(227,0,44,.18)}
.t-taipei:hover::before{animation:slide .8s linear infinite}
.t-taipei:hover .icon{animation:zoom .5s ease-in-out infinite alternate}

/* 9 巷戰突擊：暗夜軍事科技風 */
.t-alley{background:#171b1e;color:#e8e4da;font-family:var(--tech);border-radius:4px;border:1px solid #2a3136;padding-top:38px}
.t-alley::before{top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(-45deg,#ffb020 0 10px,#101315 10px 20px)}
.t-alley::after{right:16px;bottom:16px;width:72px;height:72px;border-radius:50%;border:2px solid rgba(74,210,192,.4);background:linear-gradient(rgba(74,210,192,.4),rgba(74,210,192,.4)) center/2px 100% no-repeat,linear-gradient(rgba(74,210,192,.4),rgba(74,210,192,.4)) center/100% 2px no-repeat;transition:transform .5s,border-color .3s}
.t-alley .tag{background:transparent;color:#ffb020;border:1px solid #ffb020;border-radius:2px}
.t-alley h3{color:#fff;letter-spacing:.04em}
.t-alley p{color:#a9b1b6}
.t-alley .btn{background:#ffb020;color:#1a1205;border-radius:2px;font-family:var(--tech)}
.t-alley .btn:hover{background:#4ad2c0}
.t-alley:hover{transform:translateY(-6px);border-color:#4ad2c0;box-shadow:0 0 0 1px #4ad2c0,0 16px 36px rgba(0,0,0,.45)}
.t-alley:hover::after{transform:rotate(90deg) scale(1.1);border-color:#e5484d}

/* 10 屋頂狂奔：都會跑酷動感風 */
.t-roof{background:linear-gradient(180deg,#7fb8ee,#cfeaff 70%,#e6f3fb);color:#14111f;border-radius:14px;padding-bottom:58px}
.t-roof::before{right:0;top:22%;width:55%;height:42%;background:repeating-linear-gradient(180deg,transparent 0 14px,rgba(255,255,255,.75) 14px 16px);-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000)}
.t-roof::after{left:0;right:0;bottom:0;height:40px;background:#3f86d6;clip-path:polygon(0 100%,0 30%,22% 30%,22% 55%,30% 55%,30% 10%,52% 10%,52% 45%,60% 45%,60% 25%,82% 25%,82% 60%,88% 60%,88% 20%,100% 20%,100% 100%)}
.t-roof .tag{background:#14111f;color:#ffd23f}
.t-roof h3{font-family:var(--cond);font-style:italic;font-size:27px}
.t-roof p{color:#2c2a3a}
.t-roof .btn{background:#ff6a2b;color:#fff;border-radius:6px;transform:skewX(-10deg)}
.t-roof .btn:hover{transform:skewX(-10deg) translateX(4px);box-shadow:-6px 0 0 #ffd23f}
.t-roof:hover{transform:translate(4px,-6px) skewX(-1.5deg);box-shadow:-10px 16px 30px rgba(63,134,214,.35)}
.t-roof:hover::before{animation:rise .4s linear infinite;background-size:100% 40px}

/* 11 方塊大陸：像素方塊風 */
.t-block{background:linear-gradient(#79d14e 0 20px,#4e8f2e 20px 26px,transparent 26px),repeating-conic-gradient(#5b4128 0 25%,#4f3822 0 50%) 0 26px/16px 16px;color:#fff;border-radius:0;font-family:var(--pixel);border:4px solid #05070a;padding-top:44px;transition:transform .3s steps(4),box-shadow .3s steps(4)}

   desc:'同學的原創音樂作品，按下播放鍵，一起聽聽這首歌。'}
];

const grid = document.getElementById('grid');
const filters = document.getElementById('filters');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf = w => w.name || w.file.replace(/\.(html|mp3)$/i, '').trim();
const urlOf = w => 'works/' + encodeURIComponent(w.file);

/* 統計 */
const htmlCount = WORKS.filter(w => !w.audio).length;
const audioCount = WORKS.length - htmlCount;
document.getElementById('stats').innerHTML =
  `<span class="stat"><strong>${htmlCount}</strong> 件互動網頁</span>` +
  (audioCount ? `<span class="stat"><strong>${audioCount}</strong> 首原創音樂</span>` : '') +
  `<span class="stat">💬 用說的就能做</span>`;

/* 卡片 */
function cardHTML(w, i){
  const name = esc(nameOf(w)), url = urlOf(w);
  const action = w.audio
    ? `<audio controls preload="none" src="${url}" aria-label="播放「${name}」"></audio>
       <a class="btn" href="${url}" target="_blank" rel="noopener" aria-label="立即聆聽「${name}」（另開新分頁）">立即聆聽 <span class="arr" aria-hidden="true">♪</span></a>`
    : `<a class="btn" href="${url}" target="_blank" rel="noopener" aria-label="立即體驗「${name}」（另開新分頁）">立即體驗 <span class="arr" aria-hidden="true">→</span></a>`;
  return `<article class="card t-${w.theme}" style="--d:${(i % 12) * 0.05}s">
    <div class="top"><span class="icon" aria-hidden="true">${w.icon}</span><span class="tag">${esc(w.tag)}</span></div>
    <h3>${name}</h3>
    <p>${esc(w.desc)}</p>
    ${action}
  </article>`;
}

function render(cat){
  const list = cat === 'all' ? WORKS : WORKS.filter(w => w.cat === cat);
  grid.innerHTML = list.length ? list.map(cardHTML).join('') : '<p class="empty">這個分類還沒有作品</p>';
  grid.querySelectorAll('.t-vinyl audio').forEach(a => {
    const card = a.closest('.card');
    a.addEventListener('play', () => card.classList.add('playing'));
    a.addEventListener('pause', () => card.classList.remove('playing'));
    a.addEventListener('ended', () => card.classList.remove('playing'));
  });
}

/* 分類按鈕 */
Object.entries(CATS).forEach(([key, label]) => {
  const n = key === 'all' ? WORKS.length : WORKS.filter(w => w.cat === key).length;
  if (!n) return;
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.dataset.cat = key;
  b.setAttribute('aria-pressed', key === 'all');
  b.innerHTML = `${label}<small>${n}</small>`;
  b.addEventListener('click', () => {
    filters.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    render(key);
  });
  filters.appendChild(b);
});

render('all');
</script>
